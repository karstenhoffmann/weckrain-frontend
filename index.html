  <script type="text/babel">
    const { useState, useCallback, useEffect, useRef } = React;

    // ═══ KONFIGURATION ═══════════════════════════════════════════════════

    // Frontend-Version — wird im Footer angezeigt. Bei jedem Release mit /VERSIONS.json synchron halten.
    const FRONTEND_VERSION = "1.29.1";
    // ═════════════════════════════════════════════════════════════════════

    // ─── RESPONSIVE HOOK ─────────────────────────────────────────────────
    function useIsMobile() {
      const [mobile, setMobile] = useState(window.innerWidth < 520);
      useEffect(() => {
        const onResize = () => setMobile(window.innerWidth < 520);
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return mobile;
    }

    // Returns "sm" (<520), "md" (520-899), "lg" (900+)
    function useBreakpoint() {
      const [bp, setBp] = useState(window.innerWidth < 520 ? "sm" : window.innerWidth < 900 ? "md" : "lg");
      useEffect(() => {
        const onResize = () => setBp(window.innerWidth < 520 ? "sm" : window.innerWidth < 900 ? "md" : "lg");
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);

    // ─── CONFIG ──────────────────────────────────────────────────────────
    const SLOTS = ["Nachts", "Morgens", "Vormittags", "Mittags", "Nachmittags", "Abends"];
    const SLOT_LABELS = { Nachts: "00–04", Morgens: "04–08", Vormittags: "08–12", Mittags: "12–14", Nachmittags: "14–18", Abends: "18–24" };
    const SLOT_SHORT = { Nachts: "Nachts", Morgens: "Morg.", Vormittags: "Vorm.", Mittags: "Mittags", Nachmittags: "Nachm.", Abends: "Abends" };
    const WDAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

    const ffSerif = "'Georgia', 'Times New Roman', serif";

    // ─── SUN ARC ─────────────────────────────────────────────────────────
    const SUN_ARC = { cx: 260, cy: 288, r: 252 };
    function sunPos(angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      return {
        x: SUN_ARC.cx - SUN_ARC.r * Math.cos(rad),
        y: SUN_ARC.cy - SUN_ARC.r * Math.sin(rad),

    // ─── TIME-OF-DAY THEMES ──────────────────────────────────────────────
    const SKY = {
      Nachts:      { top: "#050a14", bot: "#0c1525", stars: 0.9, moonOp: 0.15, sunAngle: -15, sunOp: 0, sunColor: "#f5c842", horizonOp: 0, horizonColor: "#1a1020", wallLight: 0 },

      Vormittags:  { top: "#2a4a7a", bot: "#5a8ab8", stars: 0, moonOp: 0, sunAngle: 55, sunOp: 1, sunColor: "#f8d84a", horizonOp: 0.1, horizonColor: "#7aaad4", wallLight: 0.18 },
      Mittags:     { top: "#3a6aa0", bot: "#7ab4d8", stars: 0, moonOp: 0, sunAngle: 90, sunOp: 1, sunColor: "#fff4b0", horizonOp: 0.05, horizonColor: "#8ac4e0", wallLight: 0.25 },
      Nachmittags: { top: "#3a5a88", bot: "#6a9ac0", stars: 0, moonOp: 0, sunAngle: 125, sunOp: 1, sunColor: "#f5c040", horizonOp: 0.15, horizonColor: "#c8a060", wallLight: 0.15 },
      Abends:      { top: "#1a1830", bot: "#3a2035", stars: 0.4, moonOp: 0.06, sunAngle: 165, sunOp: 0.6, sunColor: "#e07030", horizonOp: 0.5, horizonColor: "#b04828", wallLight: 0.04 },
    };

    // ─── HELPERS ─────────────────────────────────────────────────────────
    const fmt = (d) => { const p = d.split("-"); return p[2] + "." + p[1] + "."; };
    const wday = (d) => WDAYS[new Date(d + "T12:00:00").getDay()];
    const isOn = (v) => v === true;
    const isError = (v) => v === "offline" || v === "fehler";
    const isFehler = (v) => v === "fehler";
    const isNoData = (v) => v === null;
    const actCount = (s) => [s.k, s.s, s.e, s.g].filter(v => v === true).length;
    const errCount = (s) => [s.k, s.s, s.e, s.g].filter(v => isError(v)).length;
    const noDataCount = (s) => [s.k, s.s, s.e, s.g].filter(v => v === null).length;
    const dayAct = (d) => d.slots.reduce((a, s) => a + actCount(s), 0);
    const dayHasProblems = (d) => d.slots.some((s, idx) => errCount(s) > 0 || (noDataCount(s) === 4 && isSlotPast(d.date, idx)));

    function getNowSlot() {
      const h = new Date().getHours();
      if (h < 4) return 0;
      if (h < 8) return 1;
      if (h < 12) return 2;
      if (h < 14) return 3;
      if (h < 18) return 4;
      return 5;
    }

    // Prüft ob ein Zeitfenster bereits vollständig vergangen ist.
    // Nur vergangene Slots ohne Daten = echtes Verbindungsproblem.
    // Aktuelle/zukünftige Slots ohne Daten = einfach noch nicht erfasst.
    const SLOT_END_HOURS = [4, 8, 12, 14, 18, 24];
    function isSlotPast(dateStr, slotIdx) {
      const now = new Date();
      const today = now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
      if (dateStr < today) return true;   // vergangener Tag → alle Slots vorbei
      if (dateStr > today) return false;  // zukünftiger Tag → kein Slot vorbei
      return now.getHours() >= SLOT_END_HOURS[slotIdx]; // heute → Stunde prüfen
    }

    function getWeather(day) {
      const act = dayAct(day);
      const pastSlots = day.slots.filter((s, idx) => isSlotPast(day.date, idx));
      const allNull = pastSlots.length > 0 && pastSlots.every(s => noDataCount(s) === 4);
      if (allNull) return { label: "Keine Verbindung", color: "#d4916a", bg: "rgba(212,145,106,0.1)" };
      if (act >= 8) return { label: "Freundlich", color: "#e8b931", bg: "rgba(232,185,49,0.1)" };
      if (act >= 4) return { label: "Heiter", color: "#7db8e0", bg: "rgba(125,184,224,0.08)" };
      if (act >= 1) return { label: "Ruhig", color: "#9aaabe", bg: "rgba(154,170,190,0.08)" };
      return { label: "Neblig", color: "#6a7a90", bg: "rgba(106,122,144,0.08)" };
    }

    function timeSince(isoStr) {
      if (!isoStr) return "unbekannt";
      const diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 60000);
      if (diff < 1) return "gerade eben";
      if (diff < 60) return "vor " + diff + " Min.";
      const h = Math.floor(diff / 60);
      if (h < 24) return "vor " + h + " Std.";
      return "vor " + Math.floor(h / 24) + " Tag(en)";
    }

    // ─── COLORS ──────────────────────────────────────────────────────────
    const C = {
      kitchen: { on: "#f0c45a", off: "#1a2133" },
      tv: { on: "#6ba4d4", off: "#1a2133" },
      door: { on: "#7bc77e", off: "#4a4a50" },
      bird: { on: "#c49bdb" },
      error: "#c27a5a", offline: "#8a7050", noData: "#3a3545",
      textHi: "#e8edf5", textMid: "#a0b0c4", textLo: "#8494a7", textFaint: "#5e7086",
    };

    function winColor(val, palette) {
      if (isOn(val)) return palette.on;
      if (val === "offline") return C.offline;
      if (val === "fehler") return C.error;
      if (val === null) return C.noData;
      return palette.off;
    }

    const T = (dur = "0.8s") => "all " + dur + " cubic-bezier(0.4, 0, 0.2, 1)";

    function easeInOut(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ─── ANIMATED VALUE HOOK ─────────────────────────────────────────────
    function useAnimatedValue(target, duration) {
      duration = duration || 1200;
      const [value, setValue] = useState(target);
      const animRef = useRef(null);
      const currentRef = useRef(target);

      useEffect(() => {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        const start = currentRef.current;
        const delta = target - start;
        if (Math.abs(delta) < 0.1) { setValue(target); currentRef.current = target; return; }
        const t0 = performance.now();

        function tick(now) {
          const elapsed = now - t0;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeInOut(progress);
          const v = start + delta * eased;
          currentRef.current = v;
          setValue(v);
          if (progress < 1) { animRef.current = requestAnimationFrame(tick); }
        }
        animRef.current = requestAnimationFrame(tick);
        return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
      }, [target, duration]);

      return value;
    }

    // ─── ANIMATED COLOR HOOK ─────────────────────────────────────────────
    // Smooth RGB-Interpolation zwischen zwei Hex-Farben.
    // Nötig für background-gradients, weil Browser linear-gradients nicht
    // nativ über CSS `transition` animieren können (der Gradient wird
    // beim Farbwechsel sonst hart umgeschaltet).
    function hexToRgb(hex) {
      var h = hex.replace("#", "");
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var num = parseInt(h, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }
    function rgbToCss(rgb) {
      return "rgb(" + Math.round(rgb[0]) + "," + Math.round(rgb[1]) + "," + Math.round(rgb[2]) + ")";
    }
    function useAnimatedColor(targetHex, duration) {
      duration = duration || 1200;
      const targetRgb = hexToRgb(targetHex);
      const [rgb, setRgb] = useState(targetRgb);
      const animRef = useRef(null);
      const currentRef = useRef(targetRgb);

      useEffect(() => {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        const start = currentRef.current.slice();
        const delta = [targetRgb[0] - start[0], targetRgb[1] - start[1], targetRgb[2] - start[2]];
        if (Math.abs(delta[0]) < 0.5 && Math.abs(delta[1]) < 0.5 && Math.abs(delta[2]) < 0.5) {
          setRgb(targetRgb); currentRef.current = targetRgb; return;
        }
        const t0 = performance.now();

        function tick(now) {
          const elapsed = now - t0;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeInOut(progress);
          const v = [start[0] + delta[0] * eased, start[1] + delta[1] * eased, start[2] + delta[2] * eased];
          currentRef.current = v;
          setRgb(v);
          if (progress < 1) { animRef.current = requestAnimationFrame(tick); }
        }
        animRef.current = requestAnimationFrame(tick);
        return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
      }, [targetHex, duration]);

      return rgbToCss(rgb);
    }

    // ─── HOUSE COMPONENT ─────────────────────────────────────────────────
    // ─── REH 3D (Vorschau) ───────────────────────────────────────────────
    // Echtes 3D-Modell aus weichen Grundformen, flach eingefärbt wie die
    // SVG-Szene (Cel-Shading mit wenigen Tonstufen). Gerendert mit three.js
    // in ein transparentes Canvas, das exakt über dem Gartenbereich der SVG-
    // Szene liegt. Drehen, Wenden und Umschauen sind echte Rotationen.
    //
    // Weltkoordinaten: x = SVG-x (absolut), y nach oben, y=0 = Boden (SVG y 308),
    // z zum Betrachter. Reh-lokal: x nach vorn (Kopf), y nach oben, z zur
    // Betrachterseite; Hufe bei y=0. Gelenkwinkel wie beim 2D-Reh in Grad,
    // positiv = Kopf/Bein nach unten bzw. hinten (→ rotation.z = -Winkel).
    // Gier (yaw): 0 = schaut nach rechts, -90 = zum Betrachter, -180 = links.

    const THREE_URL = "https://unpkg.com/three@0.149.0/build/three.min.js";
    let threeLoading = null;
    function loadThree() {
      if (window.THREE) return Promise.resolve(window.THREE);
      if (!threeLoading) threeLoading = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = THREE_URL; s.async = true;
        s.onload = () => (window.THREE ? res(window.THREE) : rej(new Error("THREE fehlt")));
        s.onerror = () => rej(new Error("three.js nicht geladen"));
        document.head.appendChild(s);
      });
      return threeLoading;
    }

    const D3 = {
      GROUND: 308, SCALE: 1.15, TILT: 10 * Math.PI / 180,
      REGION: { x0: 0, y0: 0, x1: 520, y1: 320 },      // Canvas = ganze Szene (SVG-Koordinaten)
      RANGE: [100, 220], HOME: 125,                     // Rasen links vor dem Haus
      BROWN: 0xa6724a, DARK: 0x8b5a3c, CREAM: 0xf5e6c4, MUZZLE: 0xc9956b, EAR_IN: 0xe0a88a,
    };
    const P3_BASE = {
      bodyY: 0, pitch: 0, neck: 0, head: 0, neckYaw: 0, headYaw: 0, headRoll: 0,
      fH1: 0, fK1: 3, fH2: 0, fK2: 3, hH1: -16, hK1: 32, hH2: -16, hK2: 32,
      earL: 0, earR: 0, tail: 0, eyes: 0,
    };
    const P3_LIE = { fH1: 75, fK1: -155, fH2: 70, fK2: -150, hH1: -80, hK1: 155, hH2: -75, hK2: 150 };
    const P3_POSES = {
      stand: {},
      graze: { neck: 62, head: 6, fH1: -3, fH2: 4 },
      alert: { neck: -12, head: -6, earL: -12, earR: -12 },
      sniff: { pitch: 3, neck: 51, head: -26, earL: -6, earR: -6, fH1: -4 },
      // Sitzen: Po am Boden, Brust aufgerichtet, Vorderbeine gestreckt, Hinterbeine gefaltet
      sit:   { bodyY: 6.4, pitch: -35, neck: 2, head: -2, fH1: -7, fK1: 2, fH2: -3, fK2: 1,
               hH1: -102, hK1: 26, hH2: -97, hK2: 22, tail: 30 },
      lie:   Object.assign({ bodyY: 9.5, neck: 4, head: -4 }, P3_LIE),
      sleep: Object.assign({ bodyY: 9.5, neck: 44, head: -8, neckYaw: -25, headRoll: 10, earL: 22, earR: 22, eyes: 1 }, P3_LIE),
    };
    const P3_TAU = {
      bodyY: 0.45, pitch: 0.4, neck: 0.5, head: 0.42, neckYaw: 0.55, headYaw: 0.4, headRoll: 0.5,
      fH1: 0.2, fK1: 0.2, fH2: 0.24, fK2: 0.24, hH1: 0.22, hK1: 0.22, hH2: 0.26, hK2: 0.26,
      earL: 0.16, earR: 0.18, tail: 0.15, eyes: 0.3,
    };
    const P3_ACTIONS = {
      idle:   ["stand", 3, 6, 1.5],
      graze:  ["graze", 6, 12, 2.4],
      look:   ["stand", 7.5, 7.5, 1.6],
      viewer: ["stand", 3.5, 5.5, 1.3],
      back:   ["stand", 3, 4.5, 1],
      sniff:  ["sniff", 3, 5, 1.3],
      walk:   ["stand", 20, 20, 2.6],
      rest:   ["lie", 25, 45, 0.5],
      sit:    ["sit", 12, 25, 0.8],
    };
    const P3_LOOK_SEQ = [[0, "pt", 60, 45], [1.7, "viewer"], [3.6, "back"], [5.6, "pt", 60, 22]];

    // Uhr: im Test über window.__deerClock steuerbar (bildgenaue Videos), sonst Echtzeit
    const deerClock = () => (window.__deerClock ? window.__deerClock.t : performance.now());
    const c3 = (v, a, b) => Math.max(a, Math.min(b, v));
    const r3 = (a, b) => a + Math.random() * (b - a);
    const rad = (d) => d * Math.PI / 180;

    // Hinterbein-Kinematik fürs Hinsetzen/Aufstehen (Winkel in Grad, Richtung eines Segments: (-sin a, -cos a))
    const LEG_H = [6.8, 6.45];   // Oberschenkel, Unterschenkel bis Hufmitte
    const hipAt = (legX, hipY, bodyY, pitch) => {
      const pa = -rad(pitch), lx = legX + 2, ly = hipY - 18;
      return [-2 + lx * Math.cos(pa) - ly * Math.sin(pa), 18 - bodyY + lx * Math.sin(pa) + ly * Math.cos(pa)];
    };
    const hoofAt = (hip, h, k) => [hip[0] - LEG_H[0] * Math.sin(rad(h)) - LEG_H[1] * Math.sin(rad(h + k)),
                                   hip[1] - LEG_H[0] * Math.cos(rad(h)) - LEG_H[1] * Math.cos(rad(h + k))];
    // Zwei-Gelenk-IK: Knie knickt nach vorn (k > 0)
    const legIK = (hip, tgt) => {
      const vx = tgt[0] - hip[0], vy = tgt[1] - hip[1], [a, b] = LEG_H;
      const D = c3(Math.hypot(vx, vy), Math.abs(a - b) + 0.01, a + b - 0.01);
      const A = Math.acos(c3((a * a + D * D - b * b) / (2 * a * D), -1, 1));
      const K = Math.PI - Math.acos(c3((a * a + b * b - D * D) / (2 * a * b), -1, 1));
      return [Math.atan2(-vx, -vy) * 180 / Math.PI - A * 180 / Math.PI, K * 180 / Math.PI];
    };

    function buildDeer3D(T) {
      const grad = new T.DataTexture(new Uint8Array([150, 150, 150, 255, 205, 205, 205, 255, 255, 255, 255, 255]), 3, 1, T.RGBAFormat);
      grad.minFilter = grad.magFilter = T.NearestFilter; grad.needsUpdate = true;
      const mat = (color) => new T.MeshToonMaterial({ color, gradientMap: grad });
      const M = {
        brown: mat(D3.BROWN), dark: mat(D3.DARK), cream: mat(D3.CREAM), white: mat(0xffffff),
        muzzle: mat(D3.MUZZLE), muzzleLight: mat(0xf3dcb8), earIn: mat(0xf0b0a0), hoof: mat(0x2a1a12),
        spot: mat(0xfff3dc),
        lid: new T.MeshBasicMaterial({ color: 0x2b1a10 }), iris: new T.MeshBasicMaterial({ color: 0x6e3f20 }),
        irisLight: new T.MeshBasicMaterial({ color: 0x9a6236 }), pupil: new T.MeshBasicMaterial({ color: 0x180e08 }),
        shine: new T.MeshBasicMaterial({ color: 0xffffff }), nose: new T.MeshBasicMaterial({ color: 0x2a1a14 }),
      };
      const SPH = new T.SphereGeometry(1, 28, 20);
      const ell = (m, rx, ry, rz, x, y, z) => { const o = new T.Mesh(SPH, m); o.scale.set(rx, ry, rz); o.position.set(x || 0, y || 0, z || 0); return o; };
      const grp = (x, y, z) => { const g = new T.Group(); g.position.set(x || 0, y || 0, z || 0); return g; };
      const J = {};

      const root = grp();
      J.root = root;

      // Schatten (flach auf dem Boden)
      const shadow = new T.Mesh(new T.CircleGeometry(1, 32), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.26, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2; shadow.scale.set(19, 5.5, 1); shadow.position.set(-1, 0.4, 0);
      root.add(shadow); J.shadow = shadow;

      // ── Beine ──
      // Vorderbeine: oben kräftig (Unterarm-Muskel), nach unten sehr schlank.
      // Hinterbeine: Keule + Z-Form (Grundpose: Oberschenkel nach vorn, Sprunggelenk nach hinten).
      // Drehkörper aus einem Umriss [Radius, Höhe] → weich geformtes Beinsegment
      const lathe = (prof, m, flatZ) => {
        const g = new T.LatheGeometry(prof.map(([r, y]) => new T.Vector2(r, y)), 18);
        const o = new T.Mesh(g, m); o.scale.z = flatZ; return o;
      };
      const PROF_HIND_UP = [[0, 1.2], [1.9, 0.9], [2.7, -0.6], [2.6, -2.4], [2.0, -4.2], [1.25, -5.8], [0.85, -6.8], [0, -7.1]];

      const headRoll = grp(); head.add(headRoll); J.headRoll = headRoll;

        [0x7fb2ff, 0x6a9cf2, 0x263a6e, 0x263a6e, 0xffffff, 0x6a9cf2, 0x6a9cf2],   // Bläuling

    // Kantenlicht (Rim Light) für die Hauptfiguren: schmale, weiche Aufhellung an den Silhouettenkanten auf der
    // Lichtseite. Löst die Figur ohne Konturlinie vom Hintergrund (Standardmittel im Animationsfilm).
    // R: gemeinsame Uniforms { rimColor, rimStrength, rimDir (Blickraum) }.
    function addRim(mat, R) {
      mat.onBeforeCompile = (sh) => {
        Object.assign(sh.uniforms, R);
        sh.fragmentShader = "uniform vec3 rimColor; uniform float rimStrength; uniform vec3 rimDir;\n" + sh.fragmentShader.replace(
          "#include <output_fragment>",
          `float rimF = 1.0 - clamp(dot(normal, vec3(0.0, 0.0, 1.0)), 0.0, 1.0);
           float rimBand = smoothstep(0.52, 0.78, rimF);
           float rimSide = smoothstep(-0.25, 0.55, dot(normal, normalize(rimDir)));
           outgoingLight += rimColor * rimStrength * rimBand * rimSide;
           #include <output_fragment>`);
      };
      mat.customProgramCacheKey = () => "rim";
      mat.needsUpdate = true;
    }

    // ─── 3D-SZENE (Standard für alle) ───────────────────────────────────────
    // Haus, Garten und Bäume als echte 3D-Objekte im selben Canvas wie das Reh.
    // Gleiche Kamera wie das Reh (orthografisch, 10° von oben). Die Hausfront liegt so in der Tiefe,
    // dass sie pixelgenau dort erscheint, wo sie im SVG lag; Zaun, Büsche, Bäume stehen davor.
    // Flache Illustrationsfarben (MeshBasic) fürs Haus, Toon-Schattierung für Bäume.
    function scenePreviewOn() {
      try {
        const q = new URLSearchParams(window.location.search).get("szene");
        // Standard für alle. ?szene=2d schaltet auf diesem Gerät zurück zur klassischen Ansicht, ?szene=3d wieder an.
        if (q === "2d") localStorage.setItem("wetter_szene", "2d");
        if (q === "3d") localStorage.removeItem("wetter_szene");
        return localStorage.getItem("wetter_szene") !== "2d";
      } catch (e) { return false; }
    }

    // Schneedecke zu Beginn (Vorschau): ?schnee=0..1 (Standard 0 = leer, wächst während es schneit)
    function snowStartAmount() {
      try { const q = parseFloat(new URLSearchParams(window.location.search).get("schnee")); return isNaN(q) ? 0 : Math.max(0, Math.min(1, q)); } catch (e) { return 0; }
    }

    // Hausvariante der 3D-Vorschau: ?haus=a|b|c|d (Standard a, von Karsten gewählt)
    function houseVariant() {
      try {
        const q = new URLSearchParams(window.location.search).get("haus");
        if (["a", "b", "c", "d"].includes(q)) localStorage.setItem("wetter_haus", q);
        const v = localStorage.getItem("wetter_haus");
        return ["a", "b", "c", "d"].includes(v) ? v : "a";
      } catch (e) { return "a"; }
    }

    // Jahreszeit der 3D-Szene: nach Datum, zum Testen ?jahreszeit=fruehling|sommer|herbst|spaetherbst|winter (auto = Datum).
    // ?winter=1 erzwingt Winter. Weihnachtsschmuck vom 1. Dezember bis 6. Januar (bei erzwungenem Winter immer).
    const SEASONS = ["fruehling", "sommer", "herbst", "spaetherbst", "winter"];
    function seasonInfo() {
      let forced = null;
      try {
        const q = new URLSearchParams(window.location.search).get("jahreszeit");
        if (q === "auto") localStorage.removeItem("wetter_jahreszeit");
        else if (SEASONS.includes(q)) localStorage.setItem("wetter_jahreszeit", q);
        forced = winterPreviewOn() ? "winter" : localStorage.getItem("wetter_jahreszeit");
      } catch (e) { /* egal */ }
      const d = new Date(), m = d.getMonth();
      const byDate = m <= 1 || m === 11 ? "winter" : m <= 4 ? "fruehling" : m <= 7 ? "sommer" : m <= 9 ? "herbst" : "spaetherbst";
      const season = SEASONS.includes(forced) ? forced : byDate;
      const xmas = season === "winter" && (forced === "winter" || m === 11 || (m === 0 && d.getDate() <= 6));
      return { season, xmas };
    }

    function buildScene3D(T, scene, renderer) {
      // Gestaltungsrahmen: docs/DESIGN.md. Spielzeug-Diorama, eine Toon-Bildsprache, ein Licht mit Schatten.
      const TS = Math.sin(D3.TILT), TC = Math.cos(D3.TILT), GR = D3.GROUND;
      const zG = (sy) => (sy - GR) / TS;
      const yAt = (sy, z) => (GR - sy + z * TS) / TC;
      const ZH = zG(278), DEP = 64;
      const PL = new T.PlaneGeometry(1, 1), BOX = new T.BoxGeometry(1, 1, 1), SPH = new T.SphereGeometry(1, 24, 16);
      const root = new T.Group(); scene.add(root);
      const grad = new T.DataTexture(new Uint8Array([130, 130, 130, 255, 195, 195, 195, 255, 255, 255, 255, 255]), 3, 1, T.RGBAFormat);
      grad.minFilter = grad.magFilter = T.NearestFilter; grad.needsUpdate = true;
      const toon = (hex) => new T.MeshToonMaterial({ color: hex, gradientMap: grad });
      const tints = [];
      const basic = (key, opts) => { const m = new T.MeshBasicMaterial(Object.assign({ color: 0x000000 }, opts || {})); tints.push({ m, key }); return m; };
      const fixed = (hex, opts) => new T.MeshBasicMaterial(Object.assign({ color: hex }, opts || {}));
      const shadowy = (o, cast, recv) => { o.traverse((c) => { if (c.isMesh) { c.castShadow = cast; c.receiveShadow = recv; } }); return o; };
      const add = (mesh, parent) => { (parent || root).add(mesh); return mesh; };
      const mesh = (geo, mat, cast, recv) => { const m = new T.Mesh(geo, mat); m.castShadow = !!cast; m.receiveShadow = !!recv; return m; };
      const rect = (x, y, w, h, mat, z) => { const m = mesh(PL, mat); m.scale.set(w, h / TC, 1); m.position.set(x + w / 2, yAt(y + h / 2, z), z); return add(m); };
      const box = (x, y, w, h, d, mat, z, cast, recv) => { const m = mesh(BOX, mat, cast !== false, recv !== false); m.scale.set(w, h / TC, d); m.position.set(x + w / 2, yAt(y + h / 2, z), z - d / 2); return add(m); };
      const ball = (mat, x, y, z, rx, ry, rz, parent) => { const m = mesh(SPH, mat, true, true); m.scale.set(rx, ry === undefined ? rx : ry, rz === undefined ? rx : rz); m.position.set(x, y, z); return add(m, parent); };
      const spots = [];
      let s0 = 17; const rnd = () => (s0 = (s0 * 16807) % 2147483647) / 2147483647;

      // ── Licht: Hemisphäre + Sonne/Mond mit weichem Schatten, Fensterlicht nachts ──

                      type="rotate"
                      values="0;0;-22;0;0;-25;18;-15;0;0;-22;0;0;-20;15;0;0"
                      keyTimes="0;0.414;0.421;0.427;0.593;0.599;0.604;0.610;0.616;0.764;0.770;0.776;0.893;0.899;0.904;0.910;1"
                      calcMode="linear"
                      dur="14s"
                      repeatCount="indefinite"
                      additive="sum"
                    />}
                    <path d="M 0,0 C -2,-0.5 -2,-5.5 0,-5.5 C 2,-5.5 2,-0.5 0,0 Z" fill="#fff" />
                  </g>

                  {/* KOPF-WRAPPER — Schlaf-Rotation um Hals-Pivot (11,-3).
                      headAngle: 0° (wach, Kopf oben) → 48° (schlafend, Kopf vor Körper gelegt).
                      headTilt (innen): -sleepP×10° CCW um Schädelbasis (16,-13) — Nase leicht nach
                      oben, Stirn nach unten, wirkt wie "Kopf zur Seite legen".
                      Grasen-SMIL nur aktiv wenn deerFullyAwake (!deerSleeping && sleepP < 0.05). */}
                  <g transform={`rotate(${headAngle}, 11, -3)`}>
                    <g transform={deerFullyAwake ? undefined : `rotate(${-sleepP * 10}, 16, -13)`}>
                      {deerFullyAwake && <animateTransform
                        attributeName="transform"
                        attributeType="XML"
                        type="rotate"
                        values="0 11 -3; 0 11 -3; 65 11 -3; 68 11 -3; 63 11 -3; 67 11 -3; 64 11 -3; 69 11 -3; 63 11 -3; 65 11 -3; 0 11 -3; 0 11 -3"
                        keyTimes="0; 0.4; 0.47; 0.505; 0.535; 0.565; 0.59; 0.622; 0.652; 0.68; 0.75; 1"
                        dur="16s"
                        repeatCount="indefinite"
                        calcMode="spline"
                        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.6 0 0.2 1; 0.2 0 0.6 1; 0.6 0 0.2 1; 0.2 0 0.5 1; 0.6 0 0.2 1; 0.2 0 0.6 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
                      />}

                      {/* Hals */}
                      <path d="M 8,-6 Q 13,-11 17,-13 L 21,-11 Q 16,-6 11,-3 Z" fill="#a6724a" />

                      {/* Kopf */}
                      <path d="M 14,-22 Q 20,-26 25,-22 Q 29,-18 29,-13 Q 28,-9 24,-9 Q 19,-10 15,-12 Q 12,-15 13,-20 Z" fill="#a6724a" />
                      {/* Wange-Highlight */}
                      <ellipse cx="19" cy="-14" rx="2.5" ry="2" fill="#c2875f" opacity="0.55" />

                      {/* Schnauzenbereich */}
                      <ellipse cx="27" cy="-12.5" rx="3.2" ry="2.4" fill="#c9956b" />
                      <ellipse cx="28.5" cy="-12.2" rx="1" ry="0.8" fill="#1a1a1a" />
                      <circle cx="28.7" cy="-12.5" r="0.32" fill="#fff" opacity="0.6" />

                      {/* Offenes Auge (blinzeln) — äußere Gruppe regelt Schlaf-Fade,
                          innere Gruppe animiert Blinzeln. Opazitäten multiplizieren sich. */}
                      <g opacity={1 - sleepP}>
                        <g>
                          <animate
                            attributeName="opacity"
                            values="1;1;1;1;0;1;1;1;1;0;1;1"
                            keyTimes="0;0.15;0.17;0.18;0.185;0.19;0.5;0.52;0.53;0.535;0.54;1"
                            dur="7s"
                            repeatCount="indefinite"
                          />
                          <ellipse cx="21" cy="-16.5" rx="1.6" ry="2" fill="#1a1a1a" />
                          <circle cx="21.5" cy="-17.1" r="0.65" fill="#fff" />
                          <circle cx="21" cy="-15.8" r="0.28" fill="#fff" opacity="0.8" />
                        </g>
                      </g>

                      {/* Geschlossenes Schlaf-Auge — einfacher Bogen, blendet mit sleepP ein */}
                      <path
                        d="M 19.2,-16.5 Q 21,-14.8 22.8,-16.5"
                        stroke="#1a1a1a"
                        strokeWidth="1.3"
                        fill="none"
                        strokeLinecap="round"
                        opacity={sleepP}
                      />

                      {/* Ohren — kein Zucken wenn schlafend */}
                      <g transform="translate(17, -24)">
                        <g>
                          {deerFullyAwake && <animateTransform
                            attributeName="transform"
                            type="rotate"
                            values="0;0;-16;0;0;-18;12;-12;0;0;0;0;-14;0;0"
                            keyTimes="0;0.150;0.155;0.160;0.325;0.330;0.335;0.340;0.345;0.400;0.750;0.900;0.905;0.910;1"
                            calcMode="linear"
                            dur="16s"
                            repeatCount="indefinite"
                          />}
                          <ellipse cx="0" cy="-4.5" rx="1.8" ry="4.5" fill="#8b5a3c" />
                          <ellipse cx="0" cy="-4" rx="1" ry="3.2" fill="#c2875f" opacity="0.9" />
                        </g>
                      </g>

                      <g transform="translate(19, -22)">
                        <g>
                          {deerFullyAwake && <animateTransform
                            attributeName="transform"
                            type="rotate"
                            values="3;3;-14;3;3;-12;18;-6;3;3;3;3;-10;3;3"
                            keyTimes="0;0.100;0.105;0.110;0.250;0.255;0.260;0.265;0.270;0.400;0.750;0.850;0.855;0.860;1"
                            calcMode="linear"
                            dur="16s"
                            repeatCount="indefinite"
                          />}
                          <ellipse cx="0" cy="-6.5" rx="2.3" ry="6.5" fill="#a6724a" />
                          <ellipse cx="0" cy="-6" rx="1.4" ry="4.8" fill="#e0a88a" />
                        </g>
                      </g>
                    </g>
                  </g>

                  {/* Schlaf-Zzzs — steigen aus Kopfbereich auf und faden aus (wie Musiknoten beim Vogel).
                      Im Körper-lokalen Koordinatensystem: Kopf liegt bei ca. (29, -5) wenn schlafend.
                      Alle drei Zs gestaffelt (begin=-1.8s / -2.5s) → immer mehrere gleichzeitig sichtbar. */}
                  {sleepP > 0.6 && (
                    <g opacity={Math.min((sleepP - 0.6) / 0.4, 1)} fontFamily="Georgia, 'Times New Roman', serif" fontWeight="bold">
                      <text x="35" y="-10" fontSize="5.5" fill="#b0cce0" textAnchor="middle">
                        Z
                        <animate attributeName="y" values="-10; -38" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" />
                        <animate attributeName="opacity" values="0; 0.9; 0.9; 0" keyTimes="0; 0.12; 0.78; 1" dur="4s" repeatCount="indefinite" />
                      </text>
                      <text x="31" y="-8" fontSize="4" fill="#98bcd4" textAnchor="middle">
                        z
                        <animate attributeName="y" values="-8; -30" dur="3.2s" begin="-1.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" />
                        <animate attributeName="opacity" values="0; 0.8; 0.8; 0" keyTimes="0; 0.15; 0.75; 1" dur="3.2s" begin="-1.8s" repeatCount="indefinite" />
                      </text>
                      <text x="40" y="-13" fontSize="3.2" fill="#88acc4" textAnchor="middle">
                        z
                        <animate attributeName="y" values="-13; -33" dur="2.8s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" />
                        <animate attributeName="opacity" values="0; 0.7; 0.65; 0" keyTimes="0; 0.18; 0.72; 1" dur="2.8s" begin="-2.5s" repeatCount="indefinite" />
                      </text>
                    </g>
                  )}

                  </g>
                </g>
              </g>
              </React.Fragment>)}
            </g>

            </React.Fragment>}
            {!s3 && overlayEl}
          </g>
        </svg>
        {use3d && <Deer3D sleeping={deerSleeping} isDayish={isDay || isDawn || isDusk} zzzRef={zzzRef} winter={!!winter} scene={sceneState} noBf={s3 && (season === "spaetherbst" || season === "winter")}
          light={isDay ? 1.12 : isDawn ? 0.9 : isDusk ? 0.72 : 0.55} onFail={() => setDeer3dFailed(true)} />}
        {winter && !s3 && <Snowfall slotName={slotName} />}
        {s3 && <svg viewBox="0 0 520 320" fill="none" aria-hidden="true" style={{ position: "absolute", left: 0, top: 0, width: "100%", height: "100%", pointerEvents: "none" }}>
          <g clipPath="url(#sceneClip)">
            <g transform="translate(60, 0)">
              {showBird && gErr && !gOn && <g transform="translate(200, 70)"><circle cx="0" cy="0" r="6" fill="rgba(20,20,30,0.8)" /><text x="0" y="4" textAnchor="middle" fontSize="10" fill={isFehler(slot.g)?C.error:C.offline} fontFamily={ff} fontWeight="700">!</text></g>}
              {kErrBadge}{sErrBadge}{eErrBadge}
              {zzzEl}
            </g>
            {overlayEl}
          </g>
        </svg>}
        </div>
      );
    }

    // ─── MINI HOUSE ──────────────────────────────────────────────────────
    function MiniHouse({ slot, date, slotIdx, showBird, lg }) {
      const allNull = noDataCount(slot) === 4;
      const past = isSlotPast(date, slotIdx);
      const noConnection = allNull && past;
      const pending = allNull && !past;
      const sz = lg ? 38 : 30;

      return (
        <svg viewBox="0 0 30 28" fill="none" style={{ width: sz, height: szH }}>
          <polygon points="3,14 15,5 27,14" fill="#4a3828" />
          <rect x="5" y="14" width="20" height="12" fill="#2d3548" />
          {noConnection ? <React.Fragment>
            <rect x="5" y="14" width="20" height="12" fill="#2a2a35" opacity="0.7" />
            <line x1="10" y1="19" x2="20" y2="19" stroke={C.error} strokeWidth="0.8" opacity="0.5" />

            <rect x="17" y="16" width="6" height="4" rx="0.5" fill={winColor(slot.s, C.tv)} opacity={isOn(slot.s)?0.8:1} />
            <rect x="13" y="20" width="4" height="6" rx="0.5" fill={isOn(slot.e)?"#5a9b5e":isError(slot.e)?"#7a4a3a":"#3a3a42"} />

    // ─── MAIN DASHBOARD ──────────────────────────────────────────────────
    // 3D-Reh mit Schmetterling: für alle (ohne WebGL automatisch das klassische SVG-Reh).
    // ?deer=v1 → klassisches Reh auf diesem Gerät, ?deer=v2 → 3D plus Test-Leiste (nur Karsten-Modus),
    // ?deer=auto → zurück zum Standard. Wahl bleibt per localStorage.
    function useDeerMode(showBird) {
      const [mode] = useState(() => {
        try {
          const q = new URLSearchParams(window.location.search).get("deer");
          if (q === "v1" || q === "v2") localStorage.setItem("wetter_deer", q);
          if (q === "auto") localStorage.removeItem("wetter_deer");
          return localStorage.getItem("wetter_deer") || "auto";
        } catch (e) { return "auto"; }
      });
      return { use3d: mode !== "v1", panel: showBird && mode === "v2" };
    }

    // Archiv (Monatsübersicht + Wochen blättern): Standard im Karsten-Modus.
    // ?archiv=0 schaltet es auf diesem Gerät ab, ?archiv=1 wieder an.
    function archivePreviewOn() {
      try {
        const q = new URLSearchParams(window.location.search).get("archiv");
        if (q === "0") localStorage.setItem("wetter_archiv", "0");
        if (q === "1") localStorage.removeItem("wetter_archiv");
        return localStorage.getItem("wetter_archiv") !== "0" && localStorage.getItem("wetter_mode") === "karsten";
      } catch (e) { return false; }
    }

    // Archiv = aktueller Monat + drei volle Vormonate (bis zu 123 Tage)
    const ARCHIVE_MONTHS = 4;
    function archiveStart(now) {
      const d = now || new Date();
      return new Date(d.getFullYear(), d.getMonth() - (ARCHIVE_MONTHS - 1), 1);
    }
    function archiveDays() {
      const now = new Date(), start = archiveStart(now);
      return Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - start) / 864e5) + 1;
    }

    // Wetter eines Zeitfensters (Feld w der JSON-API, seit Backend 4.7.0)
    const WX_LABEL = {
      "clear-day": "Klar", "clear-night": "Klar", "partly-cloudy-day": "Teils bewölkt", "partly-cloudy-night": "Teils bewölkt",
      cloudy: "Bewölkt", fog: "Nebel", wind: "Windig", rain: "Regen", sleet: "Schneeregen", snow: "Schnee", hail: "Hagel", thunderstorm: "Gewitter",
    };
    const deNum = (v, d) => Number(v).toLocaleString("de-DE", { maximumFractionDigits: d === undefined ? 1 : d });
    function weatherText(w) {
      if (!w) return null;
      const parts = [];
      if (w.icon && WX_LABEL[w.icon]) parts.push(WX_LABEL[w.icon]);
      if (w.t !== null && w.t !== undefined) parts.push(deNum(w.t) + " °C");
      if (w.rain) parts.push(deNum(w.rain) + " mm");
      if (w.snow) parts.push(deNum(w.snow, 0) + " cm Schneedecke");
      if (w.wind !== null && w.wind !== undefined) parts.push("Wind " + deNum(w.wind, 0) + " km/h" + (w.gust >= 40 ? ", Böen " + deNum(w.gust, 0) : ""));
      return parts.length ? parts.join(" · ") : null;
    }
    // Aktivität eines Tages 0..1: Anteil der Zeitfenster, in denen Küche, Lesezimmer oder Eingang aktiv waren
    const PHONE_PINK = "#f07ac0";
    const MONTHS_LONG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    const dayActivity = (d) => d.slots.filter(s => isOn(s.k) || isOn(s.s) || isOn(s.e)).length / 6;

    function DashboardMain({ history: allHistory, lastPoll, backendVersion, showBird, onToggleBird }) {
      const deer = useDeerMode(showBird);
      const [winter2d] = useState(winterPreviewOn);
      const [scene3d] = useState(scenePreviewOn);
      const [seasonI] = useState(seasonInfo);
      const winter = scene3d ? seasonI.season === "winter" : winter2d;
      const [week, setWeek] = useState(0);
      const [selDay, setSelDay] = useState(0);
      const [selSlot, setSelSlot] = useState(getNowSlot());
      const mob = useIsMobile();
      const bp = useBreakpoint();
      const lg = bp === "lg";

      // Archiv: mehr als 7 Tage → wochenweise blättern (Woche 0 = die letzten 7 Tage)
      const archive = !!allHistory && allHistory.length > 7;
      const nWeeks = allHistory ? Math.max(1, Math.ceil(allHistory.length / 7)) : 1;
      const wk = Math.min(week, nWeeks - 1);
      const history = allHistory ? allHistory.slice(wk * 7, wk * 7 + 7) : allHistory;

      // Empty state
      if (!history || history.length === 0) {
        return (
          <div style={{ minHeight: "100vh", background: "linear-gradient(180deg, #080e1a 0%, #141e30 100%)", color: C.textHi, fontFamily: ff }}>
            <header style={{ textAlign: "center", padding: "40px 16px 6px" }}>
              <div style={{ fontSize: 12, letterSpacing: 4, color: C.textLo, textTransform: "uppercase", fontWeight: 500 }}>Mama Wetter</div>
            </header>
            <EmptyState />
          </div>
        );
      }

      const day = history[selDay] || history[0];
      const slot = day.slots[selSlot];
      const slotName = SLOTS[selSlot];

      const isDay = ["Vormittags", "Mittags", "Nachmittags"].includes(slotName);
      const bgTopTarget = isDay ? "#1a2a40" : slotName === "Morgens" ? "#10141e" : slotName === "Abends" ? "#0c1018" : "#080e1a";
      const bgBotTarget = isDay ? "#1e3050" : "#141e30";
      // JS-interpolierte Farbwerte — CSS transition kann linear-gradient
      // nicht smooth animieren, deshalb nutzen wir den useAnimatedColor-Hook.
      const bgTop = useAnimatedColor(bgTopTarget, 1200);
      const bgBot = useAnimatedColor(bgBotTarget, 1200);

      const handleNow = useCallback(() => {
        setWeek(0);
        setSelDay(0);
        setSelSlot(getNowSlot());
      }, []);

      return (
        <div style={{
          minHeight: "100vh",
          background: "linear-gradient(180deg, "+bgTop+" 0%, "+bgBot+" 100%)",
          color: C.textHi, fontFamily: ff,
          padding: 0, margin: 0, overflowX: "hidden",
          transition: T("1.2s"),
        }}>

          {/* HEADER */}
          <header style={{ textAlign: "center", padding: mob ? "20px 12px 6px" : lg ? "40px 16px 12px" : "28px 16px 8px" }}>
            <div style={{ fontSize: mob ? 11 : lg ? 18 : 12, letterSpacing: mob ? 4 : lg ? 8 : 5, color: C.textLo, textTransform: "uppercase", fontWeight: lg ? 400 : 500 }}>
              Mama Wetter
            </div>
          </header>

          {/* DAY TABS */}
          <div style={{ display: "flex", justifyContent: "safe center", alignItems: "flex-end", gap: lg ? 4 : 0, padding: mob ? "6px 4px 6px" : lg ? "8px 16px 16px" : "10px 8px 8px", overflowX: "auto", scrollbarWidth: "none", WebkitOverflowScrolling: "touch" }}>
            {[{ key: "now", label: "Jetzt" }, ...history.map((d, i) => ({ key: d.date, label: wday(d.date), sub: fmt(d.date), idx: i, problems: dayHasProblems(d) }))].map((item, arrIdx) => {
              const isNow = item.key === "now";
              const sel = !isNow && item.idx === selDay;
              return (
                <React.Fragment key={item.key}>
                  <button onClick={() => { if (isNow) { handleNow(); } else { setSelDay(item.idx); setSelSlot(0); } }}
                    style={{
                      background: sel ? "rgba(255,255,255,0.05)" : "transparent",
                      border: "none", borderBottom: sel ? "2px solid "+C.kitchen.on : "2px solid transparent",
                      borderRadius: "8px 8px 0 0", padding: mob ? (isNow ? "8px 8px 6px" : "8px 1px 6px") : lg ? "10px 20px 8px" : "8px 14px 6px", cursor: "pointer",
                      // Handy: Tage teilen sich die Breite, damit alle 7 plus „Jetzt“ ohne Scrollen passen
                      flex: mob && !isNow ? "1 1 0" : "0 0 auto", minWidth: 0,
                      textAlign: "center", transition: T("0.3s"),
                    }}>
                    <div style={{ fontSize: mob ? 14 : lg ? 15 : 13, color: sel ? C.textHi : C.textLo, fontWeight: sel ? 500 : 400, fontFamily: ff, whiteSpace: "nowrap" }}>{item.label}</div>
                    {!isNow && <div style={{ fontSize: mob ? 11 : lg ? 13 : 11, color: sel ? C.textLo : C.textFaint, fontFamily: ff, marginTop: 1, whiteSpace: "nowrap", letterSpacing: mob ? -0.2 : 0 }}>{item.sub}</div>}
                    {!isNow && item.problems && <div style={{ width: 4, height: 4, borderRadius: "50%", backgroundColor: C.error, margin: "4px auto 0", opacity: 0.7 }} />}
                  </button>
                  {isNow && <div style={{ width: 1, height: 20, backgroundColor: "rgba(255,255,255,0.06)", margin: "0 4px", alignSelf: "center" }} />}
                </React.Fragment>
              );
            })}
          </div>

          {/* ─── TWO-COLUMN WRAPPER (lg: main left, weekly right) ─── */}
          {(() => {
            const weeklyGrid = (
              <div style={{ padding: lg ? "16px 24px" : mob ? "10px 6px 8px" : "14px 16px 8px" }}>
                {archive ? (() => {
                  const arrow = (dir, enabled) => (
                    <button onClick={() => { if (enabled) { setWeek(wk + dir); setSelDay(0); } }} aria-label={dir > 0 ? "Woche davor" : "Woche danach"}
                      style={{ background: "transparent", border: "none", cursor: enabled ? "pointer" : "default", color: enabled ? C.textMid : C.textFaint,
                        opacity: enabled ? 1 : 0.35, fontSize: mob ? 20 : 22, lineHeight: 1, padding: "4px 12px", fontFamily: ff }}>
                      {dir > 0 ? "\u2039" : "\u203A"}
                    </button>
                  );
                  return (
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: mob ? 4 : 8, marginBottom: mob ? 10 : lg ? 16 : 12 }}>
                      {arrow(1, wk < nWeeks - 1)}
                      <div style={{ textAlign: "center", minWidth: mob ? 130 : 150 }}>
                        <div style={{ fontSize: mob ? 11 : lg ? 13 : 12, color: C.textLo, textTransform: "uppercase", letterSpacing: 3, fontWeight: 500 }}>
                          {wk === 0 ? "Diese Woche" : wk === 1 ? "Vorwoche" : "Vor " + wk + " Wochen"}
                        </div>
                        <div style={{ fontSize: mob ? 12 : 13, color: C.textFaint, marginTop: 3, fontFamily: ff }}>
                          {fmt(history[history.length - 1].date)} – {fmt(history[0].date)}
                        </div>
                      </div>
                      {arrow(-1, wk > 0)}
                    </div>
                  );
                })() : (
                <div style={{ fontSize: mob ? 11 : lg ? 13 : 12, color: C.textLo, textTransform: "uppercase", letterSpacing: 3, textAlign: "center", marginBottom: mob ? 12 : lg ? 20 : 16, fontWeight: 500 }}>
                  Wochenverlauf
                </div>
                )}
                <div style={{
                  maxWidth: mob ? "100%" : 420, margin: "0 auto", display: "grid",
                  gridTemplateColumns: mob ? "54px repeat(6, 1fr)" : lg ? "64px repeat(6, 1fr)" : "60px repeat(6, 1fr)", gap: mob ? "4px 3px" : lg ? "8px 5px" : "5px 4px", alignItems: "center",
                }}>
                  <div />
                  {SLOTS.map(s => (
                    <div key={s} style={{ fontSize: mob ? 11 : lg ? 12 : 11, color: C.textFaint, textAlign: "center", fontFamily: ff }}>{s.slice(0, 2)}</div>
                  ))}
                  {history.map((d, di) => {
                    const sel = di === selDay;
                    return [
                      <div key={"l"+di} style={{ fontSize: mob ? 12 : lg ? 13 : 12, color: sel ? C.textMid : C.textFaint, fontWeight: sel ? 500 : 400, fontFamily: ff, transition: T("0.3s") }}>
                        {wday(d.date)} {fmt(d.date)}
                      </div>,
                      ...d.slots.map((s, si) => (
                        <div key={di+"-"+si} onClick={() => { setSelDay(di); setSelSlot(si); }}
                          style={{
                            cursor: "pointer", display: "flex", justifyContent: "center", padding: mob ? "4px 0" : "3px 0",
                            borderRadius: 4, background: (di===selDay && si===selSlot) ? "rgba(255,255,255,0.07)" : "transparent",
                            transition: T("0.2s"),
                          }}>
                          <MiniHouse slot={s} date={d.date} slotIdx={si} showBird={showBird} lg={lg} />
                        </div>
                      ))
                    ];
                  })}
                </div>
                {archive && (() => {
                  // Monatskalender: ein Block pro Monat (neuester zuerst), Zeilen = Kalenderwochen Mo–So,
                  // Tageszahl im Feld, Farbe = Aktivität. Tage ohne Daten bleiben leer umrandet.
                  const cell = mob ? 19 : 20, gap = 3;
                  const idxOf = {}; allHistory.forEach((d, i) => { idxOf[d.date] = i; });
                  const selIdx = wk * 7 + selDay;
                  const pad = (n) => (n < 10 ? "0" : "") + n;
                  // Immer ganze Monate: aktueller + drei Vormonate (auch wenn Daten am Anfang fehlen)
                  const now0 = new Date(), months = [];
                  for (let k = 0; k < ARCHIVE_MONTHS; k++) { const md = new Date(now0.getFullYear(), now0.getMonth() - k, 1); months.push(md.getFullYear() + "-" + pad(md.getMonth() + 1)); }
                  const monthBlock = (ym) => {
                    const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
                    const first = new Date(y, m - 1, 1), nDays = new Date(y, m, 0).getDate();
                    const lead = (first.getDay() + 6) % 7;              // Montag = 0
                    const cells = [];
                    for (let k = 0; k < lead; k++) cells.push(<div key={"p" + k} />);
                    for (let day = 1; day <= nDays; day++) {
                      const date = ym + "-" + pad(day), i = idxOf[date];
                      const d = i === undefined ? null : allHistory[i];
                      const a = d ? dayActivity(d) : 0, prob = d && dayHasProblems(d);
                      const phone = d && d.slots.some(sl => isOn(sl.g));
                      const selD = i === selIdx, selW = i !== undefined && Math.floor(i / 7) === wk;
                      cells.push(
                        <div key={day} title={d ? wday(date) + " " + fmt(date) : undefined}
                          onClick={d ? () => { setWeek(Math.floor(i / 7)); setSelDay(i % 7); } : undefined}
                          style={{ width: cell, height: cell, borderRadius: 4, boxSizing: "border-box", cursor: d ? "pointer" : "default",
                            display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontFamily: ff,
                            background: !d ? "transparent" : a > 0 ? "rgba(240,196,90," + (0.14 + a * 0.76).toFixed(2) + ")" : prob ? "rgba(194,122,90,0.4)" : "#1a2030",
                            color: !d ? "rgba(94,112,134,0.45)" : a > 0.45 ? "#2a2010" : C.textMid,
                            // pink umrandet = Telefon benutzt; Auswahl als Außenlinie, damit beides sichtbar bleibt
                            border: phone ? "2px solid " + PHONE_PINK : !d ? "1px solid rgba(255,255,255,0.04)" : "none",
                            outline: selD ? "2px solid " + C.textHi : selW ? "1px solid rgba(232,237,245,0.6)" : "none", outlineOffset: 1 }}>
                          {day}
                        </div>
                      );
                    }
                    return (
                      <div key={ym} style={{ padding: mob ? "10px 8px 8px" : "10px 10px 8px", background: "rgba(255,255,255,0.025)", borderRadius: 10 }}>
                        <div style={{ fontSize: mob ? 12 : 13, color: C.textMid, fontFamily: ff, marginBottom: 6, textAlign: "left", paddingLeft: 2 }}>
                          {MONTHS_LONG[m - 1]} <span style={{ color: C.textFaint }}>{y}</span>
                        </div>
                        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, " + cell + "px)", gap: gap }}>
                          {["M", "D", "M", "D", "F", "S", "S"].map((l, k) => (
                            <div key={"h" + k} style={{ fontSize: 9, color: C.textFaint, textAlign: "center", fontFamily: ff }}>{l}</div>
                          ))}
                          {cells}
                        </div>
                      </div>
                    );
                  };
                  return (
                    <div style={{ marginTop: mob ? 18 : 24, textAlign: "center" }}>
                      <div style={{ fontSize: mob ? 11 : 12, color: C.textFaint, textTransform: "uppercase", letterSpacing: 2, marginBottom: 12 }}>
                        Monatsübersicht
                      </div>
                      <div style={{ display: "inline-grid", gridTemplateColumns: "repeat(2, auto)", gap: mob ? 8 : 10, alignItems: "start" }}>
                        {months.map(monthBlock)}
                      </div>
                      <div style={{ fontSize: 11, color: C.textFaint, marginTop: 10, fontFamily: ff, lineHeight: 1.6 }}>
                        Heller = mehr Zeitfenster mit Aktivität<br />
                        <span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 2, border: "2px solid " + PHONE_PINK, verticalAlign: -1, marginRight: 5, boxSizing: "border-box" }} />Telefon benutzt
                      </div>
                    </div>
                  );
                })()}
              </div>
            );

            const mainContent = (
              <div style={{ flex: lg ? "1 1 0" : undefined, minWidth: 0 }}>
                {/* Shared width container — all children share the same left/right edges */}
                <div style={{ maxWidth: 604, margin: "0 auto", padding: mob ? "0 8px" : "0 12px" }}>
                {/* HOUSE */}
                <div style={{ paddingTop: mob ? 4 : 8 }}>
                  <House slot={slot} slotName={slotName} date={day.date} slotIdx={selSlot} showBird={showBird} deerV2={deer.use3d} winter={winter} scene3d={scene3d} season={scene3d ? seasonI.season : null} xmas={seasonI.xmas} />
                  {deer.panel && <DeerPreviewPanel />}
                </div>

                {/* LEGEND (Bars-Zeile) */}
                <div style={{ display: "flex", justifyContent: "center", gap: mob ? 18 : lg ? 32 : 24, padding: mob ? "12px 0 4px" : lg ? "20px 0 6px" : "14px 0 4px" }}>
                  {[
                    { color: C.kitchen.on, label: "Küche", value: slot.k },
                    { color: C.tv.on, label: "Lesezimmer", value: slot.s },
                    { color: C.door.on, label: "Eingang", value: slot.e },
                    ...(showBird ? [{ color: C.bird.on, label: "Gesang", value: slot.g }] : []),
                  ].map((s, i) => {
                    const on = isOn(s.value); const err = isError(s.value);
                    const barColor = err ? (isFehler(s.value) ? C.error : C.offline) : s.color;
                    const opacity = on ? 1 : err ? 0.8 : 0.2;
                    return (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 7, opacity: opacity, transition: T("0.5s") }}>
                        <div style={{ width: lg ? 22 : 16, height: lg ? 4 : 3, borderRadius: 2, backgroundColor: barColor, boxShadow: on ? "0 0 6px "+s.color : "none", transition: T("0.5s") }} />
                        <span style={{ fontSize: mob ? 13 : lg ? 15 : 13, color: C.textMid, fontFamily: ff }}>{s.label}</span>
                      </div>
                    );
                  })}
                </div>
                <div style={{ textAlign: "center", padding: mob ? "4px 0 8px" : lg ? "6px 0 14px" : "4px 0 8px", fontSize: mob ? 12 : lg ? 14 : 12, color: C.textFaint, fontFamily: ff, opacity: 0.8 }}>
                  Leuchtet, sobald im Zeitfenster etwas aktiv war
                </div>
                {showBird && weatherText(slot.w) && (
                  <div style={{ textAlign: "center", padding: "0 0 6px", fontSize: mob ? 12 : lg ? 14 : 12, color: C.textLo, fontFamily: ff }}>
                    {weatherText(slot.w)}
                  </div>
                )}

                {/* TIME SLOTS (Stacked Bars) */}
                <div style={{ display: "flex", justifyContent: "space-between", gap: mob ? 3 : "clamp(3px, 0.6vw, 8px)", padding: mob ? "10px 0 8px" : "clamp(10px, 1.5vw, 16px) 0 clamp(8px, 1vw, 12px)" }}>
                  {SLOTS.map((name, idx) => {
                    const s = day.slots[idx];
                    const sel = idx === selSlot;
                    const nd = noDataCount(s) === 4;
                    const slotPast = isSlotPast(day.date, idx);
                    const sensors = [
                      { v: s.k, c: C.kitchen.on },
                      { v: s.s, c: C.tv.on },
                      { v: s.e, c: C.door.on },
                      ...(showBird ? [{ v: s.g, c: C.bird.on }] : []),
                    ];
                    return (
                      <button key={name} onClick={() => setSelSlot(idx)}
                        style={{
                          background: sel ? "rgba(255,255,255,0.06)" : "transparent",
                          border: sel ? "1px solid rgba(255,255,255,0.1)" : "1px solid transparent",
                          borderRadius: mob ? 10 : "clamp(10px, 1.2vw, 12px)", padding: mob ? "10px 4px 8px" : "clamp(10px, 1.3vw, 14px) clamp(6px, 1vw, 10px) clamp(8px, 1vw, 12px)", cursor: "pointer", flex: "1 1 0", minWidth: 0, overflow: "hidden", transition: T("0.3s"),
                        }}>
                        <div style={{ fontSize: mob ? 13 : "clamp(12px, calc(8px + 0.8vw), 15px)", fontWeight: sel ? 500 : 400, color: sel ? C.textHi : C.textLo, fontFamily: ff, whiteSpace: "nowrap" }}>{SLOT_SHORT[name]}</div>
                        <div style={{ fontSize: mob ? 12 : "clamp(11px, calc(8px + 0.55vw), 13px)", color: C.textFaint, marginTop: 2, fontFamily: ff, whiteSpace: "nowrap" }}>{SLOT_LABELS[name]}</div>
                        <div style={{ marginTop: mob ? 6 : "clamp(6px, 0.8vw, 8px)", display: "flex", flexDirection: "column", alignItems: "center", gap: mob ? 2 : "clamp(2px, 0.3vw, 3px)", padding: "0 4px" }}>
                          {nd && slotPast ? (
                            <div style={{ width: "100%", maxWidth: mob ? 28 : "clamp(28px, 3.5vw, 36px)", height: mob ? 3 : "clamp(3px, 0.4vw, 4px)", borderRadius: 2, backgroundColor: C.error, opacity: 0.4 }} />
                          ) : nd && !slotPast ? (
                            <div style={{ width: "100%", maxWidth: mob ? 28 : "clamp(28px, 3.5vw, 36px)", height: mob ? 3 : "clamp(3px, 0.4vw, 4px)", borderRadius: 2, backgroundColor: C.textFaint, opacity: 0.3 }} />
                          ) : sensors.map((d, i) => (
                            <div key={i} style={{
                              width: "100%", maxWidth: mob ? 28 : "clamp(28px, 3.5vw, 36px)", height: mob ? 3 : "clamp(3px, 0.4vw, 4px)", borderRadius: 2,
                              backgroundColor: isOn(d.v) ? d.c : isError(d.v) ? C.error : "#1a2030",
                              boxShadow: isOn(d.v) ? "0 0 6px "+d.c : "none", transition: T("0.3s"),
                            }} />
                          ))}
                        </div>
                      </button>
                    );
                  })}
                </div>
                </div>{/* end shared width container */}
              </div>
            );

            return lg ? (
              <div style={{ display: "flex", gap: 0, padding: "12px 32px 0", maxWidth: 1100, margin: "0 auto", alignItems: "stretch" }}>
                <div style={{ flex: "1 1 0", minWidth: 0 }}>{mainContent}</div>
                <div style={{ width: 1, background: "linear-gradient(180deg, transparent, rgba(255,255,255,0.06) 20%, rgba(255,255,255,0.06) 80%, transparent)", margin: "0 28px", flexShrink: 0 }} />
                <div style={{ flex: "0 0 400px", display: "flex", flexDirection: "column", justifyContent: "center", padding: "24px 0", background: "rgba(255,255,255,0.015)", borderRadius: 16 }}>{weeklyGrid}</div>
              </div>
            ) : (
              <React.Fragment>
                {mainContent}
                {/* DIVIDER */}
                <div style={{ height: 1, margin: "14px 48px", background: "linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent)" }} />
                {weeklyGrid}
              </React.Fragment>
            );
          })()}

          {/* FOOTER */}
          <div style={{ textAlign: "center", padding: mob ? "20px 12px 40px" : lg ? "32px 16px 48px" : "28px 16px 40px", color: C.textFaint, fontSize: mob ? 13 : lg ? 13 : 12, letterSpacing: 1, fontFamily: ff }}>
            74653 &middot; Letzte Messung {timeSince(lastPoll)}
            <div style={{ fontSize: mob ? 10 : 9, marginTop: 4, opacity: 0.6, letterSpacing: 0.5 }}>
              Frontend v{FRONTEND_VERSION}{backendVersion ? " · Backend v" + backendVersion : ""}
            </div>
            {showBird && <div style={{ marginTop: 12 }}>
              <button onClick={onToggleBird} style={{
                background: "none", border: "none", cursor: "pointer",
                fontSize: mob ? 11 : 10, color: C.textFaint, fontFamily: ff, opacity: 0.4,
                padding: "4px 8px", transition: T("0.3s"),
              }}>Erweiterten Modus deaktivieren</button>
            </div>}
          </div>
        </div>
      );
    }

    // ─── APP (STATE MANAGER) ────────────────────────────────────────────
    function App() {
      const [state, setState] = useState("loading"); // "loading" | "login" | "error" | "ready"
      const [data, setData] = useState(null);
      const [lastPoll, setLastPoll] = useState(null);
      const [backendVersion, setBackendVersion] = useState(null);
      const [pw, setPw] = useState(() => {
        const urlPw = new URLSearchParams(window.location.search).get("pw");
        if (urlPw) { const lc = urlPw.toLowerCase(); localStorage.setItem("wetter_pw", lc); return lc; }
        return localStorage.getItem("wetter_pw") || "";
      });
      const [showBird, setShowBird] = useState(() => {
        const urlMode = new URLSearchParams(window.location.search).get("mode");
        if (urlMode === "karsten") { localStorage.setItem("wetter_mode", "karsten"); return true; }
        return localStorage.getItem("wetter_mode") === "karsten";
      });
      const [wrongPw, setWrongPw] = useState(false);
      const mob = useIsMobile();

      // Besucher-Tracking — feuert nach Login und bei jedem Aufwecken des Tabs (max. 1x / 4h)
      useEffect(() => {
        if (state !== "ready") return;

        const COOLDOWN_MS = 4 * 60 * 60 * 1000; // 4 Stunden

        const shouldLog = () => {
          const last = parseInt(localStorage.getItem("weckrain_last_tracked") || "0", 10);
          return Date.now() - last > COOLDOWN_MS;
        };

        const doLog = () => {
          if (!shouldLog()) return;
          localStorage.setItem("weckrain_last_tracked", String(Date.now()));

          // ── Geräte-UUID (stabil über Sessions) ──
          let deviceId = localStorage.getItem("weckrain_device_id");
          if (!deviceId) {
            deviceId = typeof crypto !== "undefined" && crypto.randomUUID
              ? crypto.randomUUID()
              : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
                  const r = Math.random() * 16 | 0;
                  return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
                });
            localStorage.setItem("weckrain_device_id", deviceId);
          }

          const ua = navigator.userAgent || "";

          // ── Geräteklasse ──
          const isTablet = /iPad|Android(?!.*Mobile)/i.test(ua);
          const isMobilePhone = /iPhone|Android.*Mobile|Mobile.*Android/i.test(ua);
          const deviceType = isTablet ? "Tablet" : isMobilePhone ? "Phone" : "Desktop";

          // ── OS ──
          let os = "Unknown", osVersion = "";
          if (/iPhone|iPad/.test(ua)) {
            os = "iOS"; const m = ua.match(/OS (\d+[_\d]*)/); osVersion = m ? m[1].replace(/_/g, ".") : "";
          } else if (/Android/.test(ua)) {
            os = "Android"; const m = ua.match(/Android (\d+[.\d]*)/); osVersion = m ? m[1] : "";
          } else if (/Windows/.test(ua)) {
            os = "Windows"; const m = ua.match(/Windows NT (\d+\.\d+)/); osVersion = m ? m[1] : "";
          } else if (/Mac OS X/.test(ua)) {
            os = "macOS"; const m = ua.match(/Mac OS X (\d+[_\d]*)/); osVersion = m ? m[1].replace(/_/g, ".") : "";
          }

          // ── Browser ──
          let browser = "Unknown", browserVersion = "";
          if (/CriOS\/(\d+)/.test(ua))        { browser = "Chrome (iOS)"; browserVersion = RegExp.$1; }
          else if (/Chrome\/(\d+)/.test(ua))  { browser = "Chrome";       browserVersion = RegExp.$1; }
          else if (/Firefox\/(\d+)/.test(ua)) { browser = "Firefox";      browserVersion = RegExp.$1; }
          else if (/Version\/(\d+).*Safari/.test(ua)) { browser = "Safari"; browserVersion = RegExp.$1; }

          // ── Fingerprint (v2, stabil) ──
          // Nur Merkmale, die sich bei Browser- oder OS-Updates nicht ändern:
          // keine Versionsnummern, Bildschirm unabhängig von der Drehung.
          const sw = Math.min(screen.width, screen.height), sh = Math.max(screen.width, screen.height);
          const fpRaw = ["v2", os, deviceType, browser.replace(/ \(iOS\)$/, ""), sw, sh,
            window.devicePixelRatio || 1,
            Intl.DateTimeFormat().resolvedOptions().timeZone,
            navigator.language,
            navigator.hardwareConcurrency || 0,
            navigator.maxTouchPoints || 0].join("|");
          let fpHash = 0;
          for (let i = 0; i < fpRaw.length; i++) {
            fpHash = Math.imul(31, fpHash) + fpRaw.charCodeAt(i) | 0;
          }
          const fingerprint = Math.abs(fpHash).toString(16).padStart(8, "0");

          const mode = localStorage.getItem("wetter_mode") || "normal";
          const storedPw = localStorage.getItem("wetter_pw") || "";

          // ── Geo-IP + Log-Call (fire-and-forget) ──
          // Zwei Dienste nacheinander: ipapi.co wird oft von Werbeblockern
          // gesperrt oder ist überlastet, dann springt geojs.io ein.
          const getJson = (url) => {
            const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
            const t = ctrl ? setTimeout(() => ctrl.abort(), 4000) : null;
            return fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
              .then(r => r.ok ? r.json() : null)
              .catch(() => null)
              .finally(() => { if (t) clearTimeout(t); });
          };
          const lookupGeo = () =>
            getJson("https://ipapi.co/json/").then(g => {
              if (g && g.city) return { city: g.city, region: g.region || "", country: g.country_name || "", isp: g.org || "", src: "ipapi" };
              return getJson("https://get.geojs.io/v1/ip/geo.json").then(j => j && j.city
                ? { city: j.city, region: j.region || "", country: j.country || "", isp: j.organization_name || "", src: "geojs" }
                : { city: "", region: "", country: "", isp: "", src: "keine" });
            });

          lookupGeo().then(geo => {
              const p = new URLSearchParams({
                action: "log", pw: storedPw,
                device_id: deviceId, fingerprint,
                device_type: deviceType, os, os_version: osVersion,
                browser, browser_version: browserVersion,
                screen_w: screen.width, screen_h: screen.height,
                dpr: window.devicePixelRatio || 1,
                city: geo.city, region: geo.region,
                country: geo.country, isp: geo.isp, geo_src: geo.src,
                mode, app_version: FRONTEND_VERSION,
                ua_raw: ua.substring(0, 300)
              });
              fetch(API_URL + "?" + p.toString()).catch(() => {});
            });
        };

        doLog(); // initial beim Laden / Login

        // Tab wieder sichtbar (Ruhemodus aufwecken, Tab-Wechsel)
        const handleVisibility = () => { if (document.visibilityState === "visible") doLog(); };
        document.addEventListener("visibilitychange", handleVisibility);
        return () => document.removeEventListener("visibilitychange", handleVisibility);
      }, [state]);

      const fetchData = useCallback((password) => {
        setState("loading");
        // Show cached data immediately while fetching fresh data
        const cached = localStorage.getItem("wetter_cache");
        if (cached) {
          try {
            const c = JSON.parse(cached);
            if (c.history) {
              setData(c.history);
              setLastPoll(c.lastPoll || null);
              setBackendVersion(c.version || null);
              setState("ready");
            }
          } catch(e) {}
        }
        fetch(API_URL + "?format=json&pw=" + encodeURIComponent(password) + (archivePreviewOn() ? "&days=" + archiveDays() : ""))
          .then(r => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(json => {
            if (json && json.history) {
              setData(json.history);
              setLastPoll(json.lastPoll || null);
              setBackendVersion(json.version || null);
              localStorage.setItem("wetter_pw", password);
              localStorage.setItem("wetter_cache", JSON.stringify({ history: json.history, lastPoll: json.lastPoll, version: json.version || null }));
              setPw(password);
              setWrongPw(false);
              setState("ready");
            } else {
              throw new Error("Invalid data");
            }
          })
          .catch(err => {
            // If we already showed cached data, don't kick back to login
            if (state === "ready" && data) return;
            localStorage.removeItem("wetter_pw");
            localStorage.removeItem("wetter_cache");
            setPw("");
            setWrongPw(true);
            setState("login");
          });
      }, [state, data]);

      useEffect(() => {
        if (pw) fetchData(pw);
        else setState("login");
      }, []);

      // Auto-refresh every 10 minutes
      useEffect(() => {
        if (state !== "ready" || !pw) return;
        const timer = setInterval(() => fetchData(pw), 10 * 60 * 1000);
        return () => clearInterval(timer);
      }, [state, pw, fetchData]);

      const handleLogin = useCallback((password) => {
        if (password.trim()) {
          fetchData(password.trim().toLowerCase());
        }
      }, [fetchData]);

      if (state === "login") return <LoginScreen onSubmit={handleLogin} wrongPw={wrongPw} mob={mob} />;
      if (state === "loading") return <LoadingScreen mob={mob} />;
      if (state === "ready" && data) return <DashboardMain history={data} lastPoll={lastPoll} backendVersion={backendVersion} showBird={showBird} onToggleBird={() => { setShowBird(false); localStorage.removeItem("wetter_mode"); const u = new URL(window.location); u.searchParams.delete("mode"); window.history.replaceState({}, "", u); }} />;
      return <LoadingScreen mob={mob} />;
    }

    // ─── RENDER ──────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
