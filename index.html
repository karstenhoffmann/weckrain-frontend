  <script type="text/babel">
    const { useState, useCallback, useEffect, useRef } = React;

    // ═══ KONFIGURATION ═══════════════════════════════════════════════════
    // Deine Google Apps Script Web-App URL (aus Deploy → Manage deployments)

    // Frontend-Version — wird im Footer angezeigt. Bei jedem Release mit /VERSIONS.json synchron halten.
    const FRONTEND_VERSION = "1.17.0";
    // ═════════════════════════════════════════════════════════════════════

    // ─── RESPONSIVE HOOK ─────────────────────────────────────────────────
    function useIsMobile() {
      const [mobile, setMobile] = useState(window.innerWidth < 520);
      useEffect(() => {
        const onResize = () => setMobile(window.innerWidth < 520);
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return mobile;
    }

    // Returns "sm" (<520), "md" (520-899), "lg" (900+)
    function useBreakpoint() {
      const [bp, setBp] = useState(window.innerWidth < 520 ? "sm" : window.innerWidth < 900 ? "md" : "lg");
      useEffect(() => {
        const onResize = () => setBp(window.innerWidth < 520 ? "sm" : window.innerWidth < 900 ? "md" : "lg");
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return bp;
    }

    // ─── CONFIG ──────────────────────────────────────────────────────────
    const SLOTS = ["Nachts", "Morgens", "Vormittags", "Mittags", "Nachmittags", "Abends"];
    const SLOT_LABELS = { Nachts: "00–04", Morgens: "04–08", Vormittags: "08–12", Mittags: "12–14", Nachmittags: "14–18", Abends: "18–24" };
    const SLOT_SHORT = { Nachts: "Nachts", Morgens: "Morg.", Vormittags: "Vorm.", Mittags: "Mittags", Nachmittags: "Nachm.", Abends: "Abends" };
    const WDAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
    const ff = "'Inter', system-ui, -apple-system, sans-serif";
    const ffSerif = "'Georgia', 'Times New Roman', serif";

    // ─── SUN ARC ─────────────────────────────────────────────────────────
    const SUN_ARC = { cx: 260, cy: 288, r: 252 };
    function sunPos(angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      return {
        x: SUN_ARC.cx - SUN_ARC.r * Math.cos(rad),
        y: SUN_ARC.cy - SUN_ARC.r * Math.sin(rad),

    }

    // ─── TIME-OF-DAY THEMES ──────────────────────────────────────────────
    const SKY = {
      Nachts:      { top: "#050a14", bot: "#0c1525", stars: 0.9, moonOp: 0.15, sunAngle: -15, sunOp: 0, sunColor: "#f5c842", horizonOp: 0, horizonColor: "#1a1020", wallLight: 0 },
      Morgens:     { top: "#1a1535", bot: "#4a2a45", stars: 0.15, moonOp: 0, sunAngle: 15, sunOp: 0.9, sunColor: "#f5a623", horizonOp: 0.4, horizonColor: "#d46a3a", wallLight: 0.08 },
      Vormittags:  { top: "#2a4a7a", bot: "#5a8ab8", stars: 0, moonOp: 0, sunAngle: 55, sunOp: 1, sunColor: "#f8d84a", horizonOp: 0.1, horizonColor: "#7aaad4", wallLight: 0.18 },
      Mittags:     { top: "#3a6aa0", bot: "#7ab4d8", stars: 0, moonOp: 0, sunAngle: 90, sunOp: 1, sunColor: "#fff4b0", horizonOp: 0.05, horizonColor: "#8ac4e0", wallLight: 0.25 },
      Nachmittags: { top: "#3a5a88", bot: "#6a9ac0", stars: 0, moonOp: 0, sunAngle: 125, sunOp: 1, sunColor: "#f5c040", horizonOp: 0.15, horizonColor: "#c8a060", wallLight: 0.15 },
      Abends:      { top: "#1a1830", bot: "#3a2035", stars: 0.4, moonOp: 0.06, sunAngle: 165, sunOp: 0.6, sunColor: "#e07030", horizonOp: 0.5, horizonColor: "#b04828", wallLight: 0.04 },
    };

    // ─── HELPERS ─────────────────────────────────────────────────────────
    const fmt = (d) => { const p = d.split("-"); return p[2] + "." + p[1] + "."; };
    const wday = (d) => WDAYS[new Date(d + "T12:00:00").getDay()];
    const isOn = (v) => v === true;
    const isError = (v) => v === "offline" || v === "fehler";
    const isFehler = (v) => v === "fehler";
    const isNoData = (v) => v === null;
    const actCount = (s) => [s.k, s.s, s.e, s.g].filter(v => v === true).length;
    const errCount = (s) => [s.k, s.s, s.e, s.g].filter(v => isError(v)).length;
    const noDataCount = (s) => [s.k, s.s, s.e, s.g].filter(v => v === null).length;
    const dayAct = (d) => d.slots.reduce((a, s) => a + actCount(s), 0);
    const dayHasProblems = (d) => d.slots.some((s, idx) => errCount(s) > 0 || (noDataCount(s) === 4 && isSlotPast(d.date, idx)));

    function getNowSlot() {
      const h = new Date().getHours();
      if (h < 4) return 0;
      if (h < 8) return 1;
      if (h < 12) return 2;
      if (h < 14) return 3;
      if (h < 18) return 4;
      return 5;
    }

    // Prüft ob ein Zeitfenster bereits vollständig vergangen ist.
    // Nur vergangene Slots ohne Daten = echtes Verbindungsproblem.
    // Aktuelle/zukünftige Slots ohne Daten = einfach noch nicht erfasst.
    const SLOT_END_HOURS = [4, 8, 12, 14, 18, 24];
    function isSlotPast(dateStr, slotIdx) {
      const now = new Date();
      const today = now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
      if (dateStr < today) return true;   // vergangener Tag → alle Slots vorbei
      if (dateStr > today) return false;  // zukünftiger Tag → kein Slot vorbei
      return now.getHours() >= SLOT_END_HOURS[slotIdx]; // heute → Stunde prüfen
    }

    function getWeather(day) {
      const act = dayAct(day);
      const pastSlots = day.slots.filter((s, idx) => isSlotPast(day.date, idx));
      const allNull = pastSlots.length > 0 && pastSlots.every(s => noDataCount(s) === 4);
      if (allNull) return { label: "Keine Verbindung", color: "#d4916a", bg: "rgba(212,145,106,0.1)" };
      if (act >= 8) return { label: "Freundlich", color: "#e8b931", bg: "rgba(232,185,49,0.1)" };
      if (act >= 4) return { label: "Heiter", color: "#7db8e0", bg: "rgba(125,184,224,0.08)" };
      if (act >= 1) return { label: "Ruhig", color: "#9aaabe", bg: "rgba(154,170,190,0.08)" };
      return { label: "Neblig", color: "#6a7a90", bg: "rgba(106,122,144,0.08)" };
    }

    function timeSince(isoStr) {
      if (!isoStr) return "unbekannt";
      const diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 60000);
      if (diff < 1) return "gerade eben";
      if (diff < 60) return "vor " + diff + " Min.";
      const h = Math.floor(diff / 60);
      if (h < 24) return "vor " + h + " Std.";
      return "vor " + Math.floor(h / 24) + " Tag(en)";
    }

    // ─── COLORS ──────────────────────────────────────────────────────────
    const C = {
      kitchen: { on: "#f0c45a", off: "#1a2133" },
      tv: { on: "#6ba4d4", off: "#1a2133" },
      door: { on: "#7bc77e", off: "#4a4a50" },
      bird: { on: "#c49bdb" },
      error: "#c27a5a", offline: "#8a7050", noData: "#3a3545",
      textHi: "#e8edf5", textMid: "#a0b0c4", textLo: "#8494a7", textFaint: "#5e7086",
    };

    function winColor(val, palette) {
      if (isOn(val)) return palette.on;
      if (val === "offline") return C.offline;
      if (val === "fehler") return C.error;
      if (val === null) return C.noData;
      return palette.off;
    }

    const T = (dur = "0.8s") => "all " + dur + " cubic-bezier(0.4, 0, 0.2, 1)";

    function easeInOut(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // ─── ANIMATED VALUE HOOK ─────────────────────────────────────────────
    function useAnimatedValue(target, duration) {
      duration = duration || 1200;
      const [value, setValue] = useState(target);
      const animRef = useRef(null);
      const currentRef = useRef(target);

      useEffect(() => {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        const start = currentRef.current;
        const delta = target - start;
        if (Math.abs(delta) < 0.1) { setValue(target); currentRef.current = target; return; }
        const t0 = performance.now();

        function tick(now) {
          const elapsed = now - t0;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeInOut(progress);
          const v = start + delta * eased;
          currentRef.current = v;
          setValue(v);
          if (progress < 1) { animRef.current = requestAnimationFrame(tick); }
        }
        animRef.current = requestAnimationFrame(tick);
        return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
      }, [target, duration]);

      return value;
    }

    // ─── ANIMATED COLOR HOOK ─────────────────────────────────────────────
    // Smooth RGB-Interpolation zwischen zwei Hex-Farben.
    // Nötig für background-gradients, weil Browser linear-gradients nicht
    // nativ über CSS `transition` animieren können (der Gradient wird
    // beim Farbwechsel sonst hart umgeschaltet).
    function hexToRgb(hex) {
      var h = hex.replace("#", "");
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var num = parseInt(h, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }
    function rgbToCss(rgb) {
      return "rgb(" + Math.round(rgb[0]) + "," + Math.round(rgb[1]) + "," + Math.round(rgb[2]) + ")";
    }
    function useAnimatedColor(targetHex, duration) {
      duration = duration || 1200;
      const targetRgb = hexToRgb(targetHex);
      const [rgb, setRgb] = useState(targetRgb);
      const animRef = useRef(null);
      const currentRef = useRef(targetRgb);

      useEffect(() => {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        const start = currentRef.current.slice();
        const delta = [targetRgb[0] - start[0], targetRgb[1] - start[1], targetRgb[2] - start[2]];
        if (Math.abs(delta[0]) < 0.5 && Math.abs(delta[1]) < 0.5 && Math.abs(delta[2]) < 0.5) {
          setRgb(targetRgb); currentRef.current = targetRgb; return;
        }
        const t0 = performance.now();

        function tick(now) {
          const elapsed = now - t0;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeInOut(progress);
          const v = [start[0] + delta[0] * eased, start[1] + delta[1] * eased, start[2] + delta[2] * eased];
          currentRef.current = v;
          setRgb(v);
          if (progress < 1) { animRef.current = requestAnimationFrame(tick); }
        }
        animRef.current = requestAnimationFrame(tick);
        return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
      }, [targetHex, duration]);

      return rgbToCss(rgb);
    }

    // ─── HOUSE COMPONENT ─────────────────────────────────────────────────
    // ─── REH 3D (Vorschau) ───────────────────────────────────────────────
    // Echtes 3D-Modell aus weichen Grundformen, flach eingefärbt wie die
    // SVG-Szene (Cel-Shading mit wenigen Tonstufen). Gerendert mit three.js
    // in ein transparentes Canvas, das exakt über dem Gartenbereich der SVG-
    // Szene liegt. Drehen, Wenden und Umschauen sind echte Rotationen.
    //
    // Weltkoordinaten: x = SVG-x (absolut), y nach oben, y=0 = Boden (SVG y 308),
    // z zum Betrachter. Reh-lokal: x nach vorn (Kopf), y nach oben, z zur
    // Betrachterseite; Hufe bei y=0. Gelenkwinkel wie beim 2D-Reh in Grad,
    // positiv = Kopf/Bein nach unten bzw. hinten (→ rotation.z = -Winkel).
    // Gier (yaw): 0 = schaut nach rechts, -90 = zum Betrachter, -180 = links.

    const THREE_URL = "https://unpkg.com/three@0.149.0/build/three.min.js";
    let threeLoading = null;
    function loadThree() {
      if (window.THREE) return Promise.resolve(window.THREE);
      if (!threeLoading) threeLoading = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = THREE_URL; s.async = true;
        s.onload = () => (window.THREE ? res(window.THREE) : rej(new Error("THREE fehlt")));
        s.onerror = () => rej(new Error("three.js nicht geladen"));
        document.head.appendChild(s);
      });
      return threeLoading;
    }

    const D3 = {
      GROUND: 308, SCALE: 1.15, TILT: 10 * Math.PI / 180,
      REGION: { x0: 0, y0: 0, x1: 520, y1: 320 },      // Canvas = ganze Szene (SVG-Koordinaten)
      RANGE: [100, 220], HOME: 125,                     // Rasen links vor dem Haus
      BROWN: 0xa6724a, DARK: 0x8b5a3c, CREAM: 0xf5e6c4, MUZZLE: 0xc9956b, EAR_IN: 0xe0a88a,
    };
    const P3_BASE = {
      bodyY: 0, pitch: 0, neck: 0, head: 0, neckYaw: 0, headYaw: 0, headRoll: 0,
      fH1: 0, fK1: 3, fH2: 0, fK2: 3, hH1: -16, hK1: 32, hH2: -16, hK2: 32,
      earL: 0, earR: 0, tail: 0, eyes: 0,
    };
    const P3_LIE = { fH1: 75, fK1: -155, fH2: 70, fK2: -150, hH1: -80, hK1: 155, hH2: -75, hK2: 150 };
    const P3_POSES = {
      stand: {},
      graze: { neck: 62, head: 6, fH1: -3, fH2: 4 },
      alert: { neck: -12, head: -6, earL: -12, earR: -12 },
      sniff: { pitch: 3, neck: 51, head: -26, earL: -6, earR: -6, fH1: -4 },
      // Sitzen: Po am Boden, Brust aufgerichtet, Vorderbeine gestreckt, Hinterbeine gefaltet
      sit:   { bodyY: 6.4, pitch: -35, neck: 2, head: -2, fH1: -7, fK1: 2, fH2: -3, fK2: 1,
               hH1: -102, hK1: 26, hH2: -97, hK2: 22, tail: 30 },
      lie:   Object.assign({ bodyY: 9.5, neck: 4, head: -4 }, P3_LIE),
      sleep: Object.assign({ bodyY: 9.5, neck: 44, head: -8, neckYaw: -25, headRoll: 10, earL: 22, earR: 22, eyes: 1 }, P3_LIE),
    };
    const P3_TAU = {
      bodyY: 0.45, pitch: 0.4, neck: 0.5, head: 0.42, neckYaw: 0.55, headYaw: 0.4, headRoll: 0.5,
      fH1: 0.2, fK1: 0.2, fH2: 0.24, fK2: 0.24, hH1: 0.22, hK1: 0.22, hH2: 0.26, hK2: 0.26,
      earL: 0.16, earR: 0.18, tail: 0.15, eyes: 0.3,
    };
    const P3_ACTIONS = {
      idle:   ["stand", 3, 6, 1.5],
      graze:  ["graze", 6, 12, 2.4],
      look:   ["stand", 7.5, 7.5, 1.6],
      viewer: ["stand", 3.5, 5.5, 1.3],
      back:   ["stand", 3, 4.5, 1],
      sniff:  ["sniff", 3, 5, 1.3],
      walk:   ["stand", 20, 20, 2.6],
      rest:   ["lie", 25, 45, 0.5],
      sit:    ["sit", 12, 25, 0.8],
    };
    const P3_LOOK_SEQ = [[0, "pt", 60, 45], [1.7, "viewer"], [3.6, "back"], [5.6, "pt", 60, 22]];

    // Uhr: im Test über window.__deerClock steuerbar (bildgenaue Videos), sonst Echtzeit
    const deerClock = () => (window.__deerClock ? window.__deerClock.t : performance.now());
    const c3 = (v, a, b) => Math.max(a, Math.min(b, v));
    const r3 = (a, b) => a + Math.random() * (b - a);
    const rad = (d) => d * Math.PI / 180;

    // Hinterbein-Kinematik fürs Hinsetzen/Aufstehen (Winkel in Grad, Richtung eines Segments: (-sin a, -cos a))
    const LEG_H = [6.8, 6.45];   // Oberschenkel, Unterschenkel bis Hufmitte
    const hipAt = (legX, hipY, bodyY, pitch) => {
      const pa = -rad(pitch), lx = legX + 2, ly = hipY - 18;
      return [-2 + lx * Math.cos(pa) - ly * Math.sin(pa), 18 - bodyY + lx * Math.sin(pa) + ly * Math.cos(pa)];
    };
    const hoofAt = (hip, h, k) => [hip[0] - LEG_H[0] * Math.sin(rad(h)) - LEG_H[1] * Math.sin(rad(h + k)),
                                   hip[1] - LEG_H[0] * Math.cos(rad(h)) - LEG_H[1] * Math.cos(rad(h + k))];
    // Zwei-Gelenk-IK: Knie knickt nach vorn (k > 0)
    const legIK = (hip, tgt) => {
      const vx = tgt[0] - hip[0], vy = tgt[1] - hip[1], [a, b] = LEG_H;
      const D = c3(Math.hypot(vx, vy), Math.abs(a - b) + 0.01, a + b - 0.01);
      const A = Math.acos(c3((a * a + D * D - b * b) / (2 * a * D), -1, 1));
      const K = Math.PI - Math.acos(c3((a * a + b * b - D * D) / (2 * a * b), -1, 1));
      return [Math.atan2(-vx, -vy) * 180 / Math.PI - A * 180 / Math.PI, K * 180 / Math.PI];
    };

    function buildDeer3D(T) {
      const grad = new T.DataTexture(new Uint8Array([150, 150, 150, 255, 205, 205, 205, 255, 255, 255, 255, 255]), 3, 1, T.RGBAFormat);
      grad.minFilter = grad.magFilter = T.NearestFilter; grad.needsUpdate = true;
      const mat = (color) => new T.MeshToonMaterial({ color, gradientMap: grad });
      const M = {
        brown: mat(D3.BROWN), dark: mat(D3.DARK), cream: mat(D3.CREAM), white: mat(0xffffff),
        muzzle: mat(D3.MUZZLE), muzzleLight: mat(0xf3dcb8), earIn: mat(0xf0b0a0), hoof: mat(0x2a1a12),
        spot: mat(0xfff3dc),
        lid: new T.MeshBasicMaterial({ color: 0x2b1a10 }), iris: new T.MeshBasicMaterial({ color: 0x6e3f20 }),
        irisLight: new T.MeshBasicMaterial({ color: 0x9a6236 }), pupil: new T.MeshBasicMaterial({ color: 0x180e08 }),
        shine: new T.MeshBasicMaterial({ color: 0xffffff }), nose: new T.MeshBasicMaterial({ color: 0x2a1a14 }),
      };
      const SPH = new T.SphereGeometry(1, 28, 20);
      const ell = (m, rx, ry, rz, x, y, z) => { const o = new T.Mesh(SPH, m); o.scale.set(rx, ry, rz); o.position.set(x || 0, y || 0, z || 0); return o; };
      const grp = (x, y, z) => { const g = new T.Group(); g.position.set(x || 0, y || 0, z || 0); return g; };
      const J = {};

      const root = grp();
      J.root = root;

      // Schatten (flach auf dem Boden)
      const shadow = new T.Mesh(new T.CircleGeometry(1, 32), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.26, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2; shadow.scale.set(19, 5.5, 1); shadow.position.set(-1, 0.4, 0);
      root.add(shadow); J.shadow = shadow;

      // ── Beine ──
      // Vorderbeine: oben kräftig (Unterarm-Muskel), nach unten sehr schlank.
      // Hinterbeine: Keule + Z-Form (Grundpose: Oberschenkel nach vorn, Sprunggelenk nach hinten).
      // Drehkörper aus einem Umriss [Radius, Höhe] → weich geformtes Beinsegment
      const lathe = (prof, m, flatZ) => {
        const g = new T.LatheGeometry(prof.map(([r, y]) => new T.Vector2(r, y)), 18);
        const o = new T.Mesh(g, m); o.scale.z = flatZ; return o;
      };
      const PROF_HIND_UP = [[0, 1.2], [1.9, 0.9], [2.7, -0.6], [2.6, -2.4], [2.0, -4.2], [1.25, -5.8], [0.85, -6.8], [0, -7.1]];
      const PROF_FRONT_UP = [[0, 1.0], [1.7, 0.6], [1.95, -1.2], [1.6, -3.2], [1.05, -5.0], [0.78, -6.3], [0, -6.7]];
      const PROF_LOW = [[0, 0.6], [0.82, 0.2], [0.74, -1.6], [0.6, -4.0], [0.6, -5.2], [0.7, -5.8], [0.55, -6.3], [0, -6.4]];
      const leg = (key, x, z, m, hind) => {
        const hip = grp(x, hind ? 13.4 : 13, z);
        hip.add(lathe(hind ? PROF_HIND_UP : PROF_FRONT_UP, m, 0.78));
        const knee = grp(0, hind ? -6.8 : -6.4, 0);
        knee.add(lathe(PROF_LOW, m, 0.85));
        const hoof = new T.Mesh(new T.CylinderGeometry(0.55, 0.85, 1.1, 10), M.hoof); hoof.position.set(0.1, -6.45, 0); knee.add(hoof);
        hip.add(knee); root.add(hip);
        J[key] = hip; J[key + "k"] = knee; J[key + "x"] = x;
      };
      leg("hl2", -9.4, -2.6, M.dark, true); leg("fl2", 10.6, -2.5, M.dark, false);
      leg("hl1", -12.4, 2.6, M.brown, true); leg("fl1", 7.8, 2.5, M.brown, false);

      // ── Körper: tiefe Brust, runder Po, Taille, cremefarbene Unterseite ──
      const body = grp(-2, 18, 0); root.add(body); J.body = body;
      const breath = grp(); body.add(breath); J.breath = breath;
      const torso = ell(M.brown, 13.2, 6.0, 5.0, -0.5, 0.9, 0); torso.rotation.z = rad(3); breath.add(torso);
      breath.add(ell(M.brown, 6.2, 6.4, 5.2, 8.0, -0.2, 0));                 // Brust (tief, unter der Rückenlinie)
      breath.add(ell(M.brown, 6.2, 6.0, 5.4, -9.3, 0.3, 0));                 // Po (rund, unter der Rückenlinie)
      breath.add(ell(M.cream, 8.5, 2.2, 3.8, 1.0, -3.9, 0));                 // Bauch (hochgezogen)
      breath.add(ell(M.cream, 2.6, 4.8, 3.6, 12.2, 0.6, 0));                 // Brust-Latz
      breath.add(ell(M.cream, 2.2, 3.2, 3.9, -14.9, 1.4, 0));                // Spiegel
      J.spotBack = grp(-3, 6.9, 0); breath.add(J.spotBack);                   // Landeplatz Rücken
      // Schnee auf dem Rücken (Winter): flache, unregelmäßige Haube, wächst mit der Schneemenge
      const snowM = mat(0xf2f6fc);
      J.snowCap = grp(-2.5, 6.6, 0); breath.add(J.snowCap);
      [[7.4, 2.3, 3.9, 0, 0.5], [4.0, 2.0, 3.1, -6.8, -0.2], [3.6, 1.8, 2.8, 6.2, -0.4], [2.6, 1.7, 2.2, 2.5, 1.2], [2.2, 1.5, 2.0, -3.5, 1.0]].forEach(([rx, ry, rz, x, y]) =>
        J.snowCap.add(ell(snowM, rx, ry, rz, x, y, 0)));
      J.snowCap.visible = false;
      // Punkte: in versetzten Reihen entlang der Wirbelsäule, per Strahl auf die
      // tatsächliche Außenhaut gesetzt (Rumpf, Brust und Po zusammen)
      const skin = breath.children.slice(0, 3);
      root.updateMatrixWorld(true);
      const ray = new T.Raycaster();
      let seed = 7;
      const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const rows = [[8, -12, 9, 2.3, 0.78], [28, -12.5, 7, 2.6, 0.7], [50, -11, 4, 3.1, 0.6], [70, -8, 1, 3.6, 0.5]];
      rows.forEach(([deg, x0, x1, step, r], ri) => {
        for (let x = x0 + (ri % 2) * step * 0.5; x <= x1; x += step) {
          const jx = x + (rand() - 0.5) * 0.9, th = rad(deg + (rand() - 0.5) * 8), rr = r * (0.8 + rand() * 0.35);
          [1, -1].forEach((side) => {
            const origin = breath.localToWorld(new T.Vector3(jx, 1 + 30 * Math.cos(th), side * 30 * Math.sin(th)));
            const aim = breath.localToWorld(new T.Vector3(jx, 1, 0));
            ray.set(origin, aim.sub(origin).normalize());
            const hit = ray.intersectObjects(skin, false)[0];
            if (!hit) return;
            const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            const sp = new T.Mesh(SPH, M.spot);
            sp.scale.set(rr, rr * 0.85, rr * 0.28);
            sp.position.copy(breath.worldToLocal(hit.point.clone())).addScaledVector(n, 0.03);
            sp.lookAt(sp.position.clone().add(n));
            breath.add(sp);
          });
        }
      });
      // Wedel: kurz, keck nach oben, oben braun, unten hell
      const tail = grp(-14.6, 4.8, 0); body.add(tail); J.tail = tail;
      const tailBrown = ell(M.brown, 1.35, 2.9, 1.3, -0.9, 2.2, 0); tailBrown.rotation.z = rad(28); tail.add(tailBrown);
      const tailWhite = ell(M.cream, 1.0, 2.3, 1.05, -0.4, 1.9, 0); tailWhite.rotation.z = rad(28); tail.add(tailWhite);

      // ── Hals: schlank, heller Streifen vorn ──
      const neckYaw = grp(12.2, 1.4, 0); body.add(neckYaw); J.neckYaw = neckYaw;
      const neck = grp(); neckYaw.add(neck); J.neck = neck;
      const neckMesh = new T.Mesh(new T.CylinderGeometry(2.7, 3.7, 10.4, 18), M.brown);
      neckMesh.position.set(2.7, 4.0, 0); neckMesh.rotation.z = -rad(32); neck.add(neckMesh);
      const throat = ell(M.cream, 1.0, 4.6, 2.1, 3.7, 3.4, 0); throat.rotation.z = -rad(32); neck.add(throat);
      neck.add(ell(M.brown, 3.6, 3.6, 3.4, 0.3, 0.4, 0));

      // ── Kopf: Gier → Neigung → Rollen ──
      const headYaw = grp(5.1, 8.5, 0); neck.add(headYaw); J.headYaw = headYaw;
      const head = grp(); headYaw.add(head); J.head = head;
      const headRoll = grp(); head.add(headRoll); J.headRoll = headRoll;
      headRoll.scale.setScalar(1.2);   // Kindchenschema: großer Kopf
      const H = headRoll;
      H.add(ell(M.brown, 5.6, 5.3, 5.0, 2.4, 4.6, 0));                      // runder Schädel
      H.add(ell(M.brown, 3.9, 3.0, 3.2, 5.8, 2.1, 0));                      // Nasenrücken
      H.add(ell(M.muzzleLight, 3.0, 2.3, 2.7, 8.1, 1.2, 0));                // helle Schnauze
      H.add(ell(M.muzzleLight, 3.2, 1.5, 2.5, 6.0, 0.1, 0));                // Kinn
      const nose = ell(M.nose, 1.2, 0.9, 1.4, 10.4, 1.9, 0); H.add(nose); J.nose = nose;
      H.add(ell(M.shine, 0.34, 0.22, 0.32, 10.7, 2.5, 0.6));
      [[0.4, 9.6, 0, 15], [-0.6, 9.8, 0.5, -10], [0.9, 9.4, -0.6, 32]].forEach(([x, y, z, a]) => {    // Stirn-Büschel
        const tuft = ell(M.brown, 0.75, 1.6, 0.75, x, y, z); tuft.rotation.z = rad(a); H.add(tuft);
      });
      // Augen: dunkler Lidrand, braune Iris, Pupille, zwei Lichtpunkte, heller Ring, Wimper
      J.eyes = [];
      [1, -1].forEach((side) => {
        // Augen flach und tief in den Schädel gesetzt (keine Glubschaugen)
        const e = grp(5.7, 5.6, side * 2.75);              // lokale z-Achse = Blickrichtung
        e.rotation.y = side > 0 ? rad(52) : Math.PI - rad(52);
        e.add(ell(M.cream, 2.6, 2.95, 0.42, 0, -0.15, -0.12));                  // heller Ring
        e.add(ell(M.lid, 2.1, 2.5, 0.55));                                      // Lidrand
        const irisG = grp(); e.add(irisG);                                      // bewegt sich (Blicksprünge)
        irisG.add(ell(M.iris, 1.8, 2.2, 0.58, 0, -0.1, 0.06));                 // Iris
        irisG.add(ell(M.irisLight, 1.2, 1.1, 0.52, 0, -0.85, 0.1));            // hellere Iris unten
        const pupil = ell(M.pupil, 1.0, 1.25, 0.52, 0, -0.05, 0.15); irisG.add(pupil);
        J.irises = J.irises || []; J.irises.push([irisG, side, pupil]);
        e.add(ell(M.shine, 0.62, 0.62, 0.2, side * 0.5, 0.75, 0.62));
        e.add(ell(M.shine, 0.27, 0.27, 0.15, side * -0.55, -0.8, 0.6));
        const lash = ell(M.lid, 0.28, 0.95, 0.2, side * -1.65, 1.85, 0.32); lash.rotation.z = side * rad(40); e.add(lash);
        H.add(e); J.eyes.push(e);
      });
      // Ohren: groß, blattförmig mit Spitze, innen rosa
      const earGeo = SPH.clone();
      const pos = earGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        if (y > 0) { const f = 1 - 0.62 * Math.pow(y, 1.6); pos.setX(i, pos.getX(i) * f); pos.setZ(i, pos.getZ(i) * f); }
      }
      earGeo.computeVertexNormals();
      J.ears = [];
      [1, -1].forEach((side) => {
        const base = grp(1.2, 8.4, side * 3.4);
        const tilt = grp(); tilt.rotation.order = "YXZ"; tilt.rotation.y = side * -rad(38);
        tilt.rotation.x = side * rad(50); tilt.rotation.z = rad(16); base.add(tilt);
        const flick = grp(); tilt.add(flick);
        const outer = new T.Mesh(earGeo, M.brown); outer.scale.set(3.1, 5.6, 0.95); outer.position.y = 4.9; flick.add(outer);
        const inner = new T.Mesh(earGeo, M.earIn); inner.scale.set(2.05, 4.2, 0.5); inner.position.set(0.25, 4.8, side * 0.6); flick.add(inner);
        H.add(base); J.ears.push(flick);
        if (side > 0) { J.spotEar = grp(0, 10.2, 0); flick.add(J.spotEar); }  // Landeplatz Ohrspitze
      });
      J.headSnow = ell(snowM, 2.9, 1.0, 2.5, 2.2, 9.7, 0); H.add(J.headSnow); J.headSnow.visible = false;

      // ── Schmetterling: echtes 3D-Modell ──
      // Körperachse = lokale x (Kopf vorn), Flügel nach ±z, oben = +y.
      // Flügelschlag = Drehung um die Körperachse (0° = flach offen, 90° = hochgeklappt).
      const bf = grp();
      const bfBodyG = grp(); bf.add(bfBodyG);
      const bm = new T.MeshBasicMaterial({ color: 0x2a1a10 });
      const sp = (rx, ry, rz, x, y, z) => { const o = new T.Mesh(SPH, bm); o.scale.set(rx, ry, rz); o.position.set(x, y, z); return o; };
      bfBodyG.add(sp(0.62, 0.5, 0.5, 0.25, 0, 0));          // Brust
      bfBodyG.add(sp(1.35, 0.36, 0.36, -1.25, -0.08, 0));   // Hinterleib
      bfBodyG.add(sp(0.38, 0.38, 0.38, 0.98, 0.06, 0));     // Kopf
      [1, -1].forEach((sd) => {                             // Fühler mit Kolben
        const a = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 2.2, 5), bm);
        a.position.set(1.65, 0.85, sd * 0.32); a.rotation.set(sd * rad(18), 0, -rad(55)); bfBodyG.add(a);
        bfBodyG.add(sp(0.14, 0.14, 0.14, 2.45, 1.48, sd * 0.62));
      });
      // Flügelformen (2D: X entlang Körper, Y nach außen)
      const shape = (pts) => {
        const s = new T.Shape(); s.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i += 3) s.bezierCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], pts[i + 2][0], pts[i + 2][1]);
        return new T.ShapeGeometry(s, 20);
      };
      const FORE = [[0.5, 0], [1.7, 0.6], [2.9, 3.3], [1.5, 4.6], [0.4, 4.9], [-1.0, 3.3], [-0.6, 1.2], [-0.5, 0.6], [-0.4, 0.2], [0.5, 0]];
      const HIND = [[-0.1, 0], [-0.3, 1.5], [-2.7, 3.3], [-3.0, 2.0], [-3.2, 0.7], [-1.7, 0.1], [-0.1, 0]];
      const grow = (pts, f, dx) => pts.map(([x, y]) => [x * f + (dx || 0), y * f]);
      // Alle Flügelschichten liegen in einer Ebene; die Reihenfolge regelt ein Tiefenversatz,
      // damit sie von oben und unten gleich aussehen (Rand hinten, Muster vorn).
      const wm = (off) => new T.MeshBasicMaterial({ side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: off, polygonOffsetUnits: off * 4 });
      const BFM = { edge: wm(3), fore: wm(2), hind: wm(2), dot: wm(0), tip: wm(0), eye: wm(0), eyeIn: wm(-1) };
      const wings = [];
      [1, -1].forEach((side) => {
        const hinge = grp(); hinge.scale.z = side; bf.add(hinge);   // links gespiegelt
        const flat = grp(); flat.rotation.x = Math.PI / 2; hinge.add(flat); // 2D-Y → 3D-z
        const add = (geo, m, z, x, y) => { const o = new T.Mesh(geo, m); o.position.set(x || 0, y || 0, z); flat.add(o); return o; };
        add(shape(grow(FORE, 1.07, 0.02)), BFM.edge, 0);
        add(shape(grow(HIND, 1.08, -0.02)), BFM.edge, 0);
        add(shape(HIND), BFM.hind, 0);
        add(shape(FORE), BFM.fore, 0);
        add(new T.CircleGeometry(0.42, 14), BFM.dot, 0, 0.75, 2.6);
        add(new T.CircleGeometry(0.3, 12), BFM.dot, 0, 0.1, 1.7);
        add(new T.CircleGeometry(0.36, 12), BFM.tip, 0, 1.2, 4.1);
        add(new T.CircleGeometry(0.62, 16), BFM.eye, 0, -1.9, 2.0);
        add(new T.CircleGeometry(0.34, 14), BFM.eyeIn, 0, -1.9, 2.0);

      });
      // Arten: [Vorderflügel, Hinterflügel, Rand, Punkte, Spitzenfleck, Augenfleck, Augen-Innen]
      J.bfPalettes = [
        [0xf2782f, 0xe8662a, 0x3a1c0c, 0x2a1408, 0xfff6dc, 0xe8662a, 0xe8662a],   // Kleiner Fuchs
        [0xf6e04e, 0xefd43f, 0xb89a1e, 0xf09a2a, 0xf6e04e, 0xefd43f, 0xefd43f],   // Zitronenfalter
        [0x7fb2ff, 0x6a9cf2, 0x263a6e, 0x263a6e, 0xffffff, 0x6a9cf2, 0x6a9cf2],   // Bläuling
        [0xc0472e, 0xb23f2a, 0x3a1810, 0x2a1008, 0xf5e6c8, 0x3a5ec0, 0xf2d24a],   // Tagpfauenauge
        [0xf7f3ea, 0xefe9dc, 0x8a8478, 0x2a2622, 0x2a2622, 0xefe9dc, 0xefe9dc],   // Kohlweißling
        [0xfaf8f0, 0xf3f0e6, 0x9a948a, 0x3a3430, 0xf28a2a, 0xf3f0e6, 0xf3f0e6],   // Aurorafalter
      ];
      J.setBfPalette = (i) => {
        const p = J.bfPalettes[i % J.bfPalettes.length];
        ["fore", "hind", "edge", "dot", "tip", "eye", "eyeIn"].forEach((k, j) => BFM[k].color.setHex(p[j]));
      };
      J.setBfPalette(0);
      bf.scale.setScalar(2.0);
      bf.visible = false;
      J.bf = bf; J.bfWings = wings;
      return J;
    }

    // ─── 3D-SZENE (Vorschau ?szene=3d) ───────────────────────────────────
    // Haus, Garten und Bäume als echte 3D-Objekte im selben Canvas wie das Reh.
    // Gleiche Kamera wie das Reh (orthografisch, 10° von oben). Die Hausfront liegt so in der Tiefe,
    // dass sie pixelgenau dort erscheint, wo sie im SVG lag; Zaun, Büsche, Bäume stehen davor.
    // Flache Illustrationsfarben (MeshBasic) fürs Haus, Toon-Schattierung für Bäume.
    function scenePreviewOn() {
      try {
        const q = new URLSearchParams(window.location.search).get("szene");
        if (q === "3d") localStorage.setItem("wetter_szene", "3d");
        if (q === "2d") localStorage.removeItem("wetter_szene");
        return localStorage.getItem("wetter_szene") === "3d" && localStorage.getItem("wetter_mode") === "karsten";
      } catch (e) { return false; }
    }

    // Jahreszeit der 3D-Szene: nach Datum, zum Testen ?jahreszeit=fruehling|sommer|herbst|spaetherbst|winter (auto = Datum).
    // ?winter=1 erzwingt Winter. Weihnachtsschmuck vom 1. Dezember bis 6. Januar (bei erzwungenem Winter immer).
    const SEASONS = ["fruehling", "sommer", "herbst", "spaetherbst", "winter"];
    function seasonInfo() {
      let forced = null;
      try {
        const q = new URLSearchParams(window.location.search).get("jahreszeit");
        if (q === "auto") localStorage.removeItem("wetter_jahreszeit");
        else if (SEASONS.includes(q)) localStorage.setItem("wetter_jahreszeit", q);
        forced = winterPreviewOn() ? "winter" : localStorage.getItem("wetter_jahreszeit");
      } catch (e) { /* egal */ }
      const d = new Date(), m = d.getMonth();
      const byDate = m <= 1 || m === 11 ? "winter" : m <= 4 ? "fruehling" : m <= 7 ? "sommer" : m <= 9 ? "herbst" : "spaetherbst";
      const season = SEASONS.includes(forced) ? forced : byDate;
      const xmas = season === "winter" && (forced === "winter" || m === 11 || (m === 0 && d.getDate() <= 6));
      return { season, xmas };
    }

    function buildScene3D(T, scene) {
      const TS = Math.sin(D3.TILT), TC = Math.cos(D3.TILT), GR = D3.GROUND;
      const zG = (sy) => (sy - GR) / TS;                       // Tiefe, in der der Boden bei SVG-y liegt
      const yAt = (sy, z) => (GR - sy + z * TS) / TC;          // Welt-y, das in Tiefe z bei SVG-y erscheint
      const ZH = zG(278), DEP = 60;                             // Hausfront, Haustiefe
      const PL = new T.PlaneGeometry(1, 1), BOX = new T.BoxGeometry(1, 1, 1), SPH = new T.SphereGeometry(1, 20, 14);
      const root = new T.Group(); scene.add(root);
      // Farben mit weichem Übergang (wie die CSS-Transitions im SVG)
      const tints = [];
      const basic = (key, opts) => {
        const m = new T.MeshBasicMaterial(Object.assign({ color: 0x000000 }, opts || {}));
        if (key) tints.push({ m, key, op: opts && opts.opacity !== undefined ? opts.opacity : 1 });
        return m;
      };
      const fixed = (hex, opts) => new T.MeshBasicMaterial(Object.assign({ color: hex }, opts || {}));
      const grad = new T.DataTexture(new Uint8Array([150, 150, 150, 255, 205, 205, 205, 255, 255, 255, 255, 255]), 3, 1, T.RGBAFormat);
      grad.minFilter = grad.magFilter = T.NearestFilter; grad.needsUpdate = true;
      const toon = (hex) => new T.MeshToonMaterial({ color: hex, gradientMap: grad });
      const add = (mesh, parent) => { (parent || root).add(mesh); return mesh; };
      // Rechteck auf einer senkrechten Ebene in Tiefe z, in SVG-Koordinaten (absolut)
      const rect = (x, y, w, h, mat, z) => {
        const m = new T.Mesh(PL, mat); m.scale.set(w, h / TC, 1); m.position.set(x + w / 2, yAt(y + h / 2, z), z); return add(m);
      };
      // Quader, dessen Vorderseite in Tiefe z das SVG-Rechteck abdeckt
      const box = (x, y, w, h, d, mat, z) => {
        const m = new T.Mesh(BOX, mat); m.scale.set(w, h / TC, d); m.position.set(x + w / 2, yAt(y + h / 2, z), z - d / 2); return add(m);
      };
      const spots = [];

      // ── Boden: Rückkante folgt der Horizont-Ellipse des SVG ──
      const gs = new T.Shape();
      const topY = (x) => 305 - 30 * Math.sqrt(Math.max(0, 1 - Math.pow((x - 260) / 280, 2)));
      gs.moveTo(-40, -90);
      for (let x = -40; x <= 560; x += 10) gs.lineTo(x, (GR - topY(x)) / TS);
      gs.lineTo(560, -90); gs.lineTo(-40, -90);
      const ground = add(new T.Mesh(new T.ShapeGeometry(gs), basic("ground", { transparent: true, opacity: 0.8 })));
      ground.rotation.x = -Math.PI / 2;
      // Gartenweg zur Tür
      const ps = new T.Shape();
      ps.moveTo(255, -ZH - 1); ps.lineTo(265, -ZH - 1); ps.quadraticCurveTo(268, 60, 274, 8); ps.lineTo(246, 8); ps.quadraticCurveTo(252, 60, 255, -ZH - 1);
      const path = add(new T.Mesh(new T.ShapeGeometry(ps), basic("path", { transparent: true, opacity: 0.55 })));
      path.rotation.x = -Math.PI / 2; path.position.y = 0.15;

      // ── Haus ──
      const wallF = basic("wall"), wallS = basic("wallDark");
      box(135, 148, 250, 130, DEP, [wallS, wallS, wallS, wallS, wallF, wallS], ZH);
      [168, 188, 208, 228, 248].forEach((y) => rect(140, y - 0.15, 240, 0.3, basic("siding", { transparent: true, opacity: 1 }), ZH + 0.05));
      // Dach: Giebeldreieck vorn, zwei Dachplatten mit Überstand, First
      const yE = yAt(148, ZH), yA = yAt(62, ZH);
      const tri = new T.Shape(); tri.moveTo(115, yE); tri.lineTo(260, yA); tri.lineTo(405, yE); tri.lineTo(115, yE);
      const gable = add(new T.Mesh(new T.ShapeGeometry(tri), basic("roof"))); gable.position.z = ZH + 0.1;
      const roofTop = basic("roofTop"), roofEdge = basic("roofEdge"), roofUnder = basic("roofUnder");
      const slopeA = Math.atan2(yA - yE, 145), slopeL = Math.hypot(145, yA - yE), RT = 1.8, OV = 7;
      // Dachplatten: Unterseite genau auf der Giebelkante, 8 Einheiten Überstand an der Traufe
      [-1, 1].forEach((sd) => {
        const slab = new T.Mesh(BOX, [roofEdge, roofEdge, roofTop, roofUnder, roofEdge, roofEdge]);

              {[[35,22,1.1],[78,38,0.7],[125,15,0.9],[180,28,0.6],[290,12,1.0],[345,35,0.8],[440,20,0.7],[52,55,0.5],[410,50,0.6],[155,45,0.4],[475,42,0.8],[20,48,0.6],[500,8,0.6],[360,52,0.9],[490,28,0.5]].map(([cx,cy,r],i) => (
                <circle key={i} cx={cx} cy={cy} r={r} fill="#d0d8e8" opacity={0.3 + (i%4)*0.15}>
                  <animate attributeName="opacity" values={(0.2+(i%3)*0.15)+";"+(0.5+(i%3)*0.1)+";"+(0.2+(i%3)*0.15)} dur={(3+i*0.5)+"s"} repeatCount="indefinite" />

            {/* MOON */}
            <g style={{ opacity: sky.moonOp, transition: T("1s") }}>
              <circle cx="440" cy="48" r="18" fill="#d4dbe8" />
              <circle cx="446" cy="44" r="16" fill={sky.top} />
            </g>

            {/* SUN (circular arc) */}
            <g style={{ opacity: sky.sunOp, transition: "opacity 1s cubic-bezier(0.4, 0, 0.2, 1)" }}>
              <circle cx={sun.x} cy={sun.y} r="50" fill="url(#sunGlow)" />
              <circle cx={sun.x} cy={sun.y} r="16" fill={sky.sunColor} style={{ transition: "fill 1s" }} />
              <circle cx={sun.x} cy={sun.y} r="24" fill={sky.sunColor} opacity="0.12" filter="url(#sunBlur)" style={{ transition: "fill 1s" }} />
            </g>

            {!s3 && <React.Fragment>
            {/* GROUND */}
            <ellipse cx="260" cy="305" rx="280" ry="30" fill={groundColor} opacity="0.8" style={{ transition: T("1s") }} />
            {winter && <SnowCover part="ground" a={snowA} slotName={slotName} />}

            {/* HOUSE GROUP (centered +60px) */}
            <g transform="translate(60, 0)">
              {kOn && <ellipse cx="135" cy="200" rx="80" ry="70" fill="url(#gK)" filter="url(#wideGlow)" />}
              {sOn && <ellipse cx="265" cy="200" rx="80" ry="70" fill="url(#gS)" filter="url(#wideGlow)" />}
              {kOn && !isDay && <ellipse cx="130" cy="288" rx="35" ry="6" fill={C.kitchen.on} opacity="0.08" />}
              {sOn && !isDay && <ellipse cx="270" cy="288" rx="35" ry="6" fill={C.tv.on} opacity="0.06" />}
              {eOn && !isDay && <ellipse cx="200" cy="292" rx="20" ry="5" fill={C.door.on} opacity="0.1" />}

              {/* CHIMNEY */}
              <rect x="275" y="88" width="20" height="45" rx="2" fill="#4a4a55" style={{ transition: trans }} />
              <rect x="272" y="84" width="26" height="7" rx="2" fill="#5a5a62" />
              {!s3 && smokeEl}

              {/* ROOF */}
              <polygon points="55,148 200,62 345,148" fill={roofColor} style={{ transition: trans }} />
              <polygon points="55,148 200,62 345,148" fill="none" stroke={roofEdge} strokeWidth="1" strokeLinejoin="round" style={{ transition: trans }} />

              {/* WALLS */}
              <rect x="75" y="148" width="250" height="130" fill={wallColor} style={{ transition: trans }} />
              <rect x="75" y="148" width="250" height="130" fill="none" stroke={"rgba(255,255,255,"+(isDay?0.08:0.04)+")"} strokeWidth="0.8" />
              {[168,188,208,228,248].map((y,i) => (
                <line key={i} x1="80" y1={y} x2="320" y2={y} stroke={"rgba(255,255,255,"+(isDay?0.04:0.02)+")"} strokeWidth="0.3" />
              ))}

              {/* KITCHEN WINDOW */}
              <g>
                <rect x="100" y="165" width="60" height="48" rx="2" fill={isDay ? "#1e2a3e" : "#1a2030"} />
                <rect x="96" y="213" width="68" height="5" rx="1.5" fill={frameBright} style={{ transition: trans }} />
                <rect x="96" y="212" width="68" height="2" rx="1" fill={frameBright} style={{ transition: trans }} />
                {[[102,167,26,21,0.85],[132,167,26,21,0.75],[102,191,26,20,0.7],[132,191,26,20,0.8]].map(([x,y,w,h,op],i) => (
                  <rect key={i} x={x} y={y} width={w} height={h} rx="1" fill={kOn ? kFill : kOffFill} opacity={kOn ? op : 1} style={{ transition: T("0.6s") }} />
                ))}
                <rect x="100" y="165" width="60" height="48" rx="2" fill="none" stroke={frameBright} strokeWidth="1.5" style={{ transition: trans }} />
                <line x1="130" y1="165" x2="130" y2="213" stroke={frameBright} strokeWidth="1.5" style={{ transition: trans }} />
                <line x1="100" y1="189" x2="160" y2="189" stroke={frameBright} strokeWidth="1.5" style={{ transition: trans }} />
                {kOn && <rect x="100" y="165" width="60" height="48" rx="2" fill={C.kitchen.on} opacity={isDay?0.08:0.15} filter="url(#softGlow)">
                  <animate attributeName="opacity" values={(isDay?0.05:0.1)+";"+(isDay?0.12:0.2)+";"+(isDay?0.05:0.1)} dur="5s" repeatCount="indefinite" />
                </rect>}
                <path d="M102,167 Q108,175 102,189" stroke={frameBright} strokeWidth="0.4" fill="none" opacity="0.2" style={{ transition: trans }} />
                <path d="M158,167 Q152,175 158,189" stroke={frameBright} strokeWidth="0.4" fill="none" opacity="0.2" style={{ transition: trans }} />
                {isDay && !kOn && <rect x="103" y="168" width="8" height="10" rx="1" fill="white" opacity="0.06" />}
                {!s3 && kErrBadge}
              </g>

              {/* TV WINDOW */}
              <g>
                <rect x="240" y="165" width="60" height="48" rx="2" fill={isDay ? "#1e2a3e" : "#1a2030"} />
                <rect x="236" y="213" width="68" height="5" rx="1.5" fill={frameBright} style={{ transition: trans }} />
                <rect x="236" y="212" width="68" height="2" rx="1" fill={frameBright} style={{ transition: trans }} />
                {[[242,167,26,21,0.75],[272,167,26,21,0.85],[242,191,26,20,0.8],[272,191,26,20,0.7]].map(([x,y,w,h,op],i) => (
                  <rect key={i} x={x} y={y} width={w} height={h} rx="1" fill={sOn ? sFill : sOffFill} opacity={sOn ? op : 1} style={{ transition: T("0.6s") }} />
                ))}
                <rect x="240" y="165" width="60" height="48" rx="2" fill="none" stroke={frameBright} strokeWidth="1.5" style={{ transition: trans }} />
                <line x1="270" y1="165" x2="270" y2="213" stroke={frameBright} strokeWidth="1.5" style={{ transition: trans }} />
                <line x1="240" y1="189" x2="300" y2="189" stroke={frameBright} strokeWidth="1.5" style={{ transition: trans }} />
                {sOn && <rect x="240" y="165" width="60" height="48" rx="2" fill={C.tv.on} opacity={isDay?0.06:0.12} filter="url(#softGlow)">
                  <animate attributeName="opacity" values={(isDay?0.04:0.08)+";"+(isDay?0.1:0.18)+";"+(isDay?0.03:0.06)+";"+(isDay?0.08:0.14)+";"+(isDay?0.04:0.08)} dur="3s" repeatCount="indefinite" />
                </rect>}
                <path d="M242,167 Q248,175 242,189" stroke={frameBright} strokeWidth="0.4" fill="none" opacity="0.2" />
                <path d="M298,167 Q292,175 298,189" stroke={frameBright} strokeWidth="0.4" fill="none" opacity="0.2" />
                {isDay && !sOn && <rect x="243" y="168" width="8" height="10" rx="1" fill="white" opacity="0.06" />}
                {!s3 && sErrBadge}
              </g>

              {/* DOOR */}
              <g>
                <rect x="181" y="218" width="38" height="60" rx="2" fill="#3a3a42" />
                <rect x="183" y="220" width="34" height="56" rx="1.5" fill={eOn ? "#5a9b5e" : eErr ? (isFehler(slot.e) ? "#7a4a3a" : "#5a4a30") : "#4a4a52"} style={{ transition: T("0.6s") }} />
                <rect x="187" y="224" width="26" height="18" rx="1" fill={eOn ? "#4d8a50" : "#3e3e46"} stroke={eOn ? "#6aaa6e" : "#555"} strokeWidth="0.5" style={{ transition: T("0.6s") }} />
                <rect x="187" y="248" width="26" height="20" rx="1" fill={eOn ? "#4d8a50" : "#3e3e46"} stroke={eOn ? "#6aaa6e" : "#555"} strokeWidth="0.5" style={{ transition: T("0.6s") }} />
                <circle cx={eOn ? 191 : 209} cy="252" r="2" fill={eOn ? "#a0d0a2" : "#888"} style={{ transition: T("0.4s") }} />
                {eOn && <React.Fragment><rect x="183" y="220" width="10" height="56" rx="1" fill="#8fce92" opacity="0.3" /><path d="M183,276 L170,290 L196,290 Z" fill={C.door.on} opacity="0.06" /></React.Fragment>}
                <rect x="178" y="276" width="44" height="4" rx="1" fill={frameBright} style={{ transition: trans }} />
                <path d="M176,218 Q200,210 224,218" fill="none" stroke={roofEdge} strokeWidth="1.5" style={{ transition: trans }} />
                {!s3 && eErrBadge}
              </g>

              {winter && <SnowCover part="house" a={snowA} slotName={slotName} />}

              {!s3 && birdEl}

              {/* GARDEN */}
              <path d="M200,280 Q195,290 188,305 Q200,308 212,305 Q205,290 200,280" fill={groundColor} opacity={0.6 * (1 - Math.min(1, snowA * 2))} style={{ transition: trans }} />
              {[35,48,61,74].map(x => (<g key={"fl"+x}><rect x={x} y="268" width="3" height="16" rx="0.5" fill={roofColor} style={{ transition: trans }} /><circle cx={x+1.5} cy="268" r="2" fill={roofColor} style={{ transition: trans }} /></g>))}
              <rect x="35" y="273" width="42" height="2.5" rx="1" fill={roofColor} style={{ transition: trans }} />
              {[326,339,352,365].map(x => (<g key={"fr"+x}><rect x={x} y="268" width="3" height="16" rx="0.5" fill={roofColor} style={{ transition: trans }} /><circle cx={x+1.5} cy="268" r="2" fill={roofColor} style={{ transition: trans }} /></g>))}
              <rect x="326" y="273" width="42" height="2.5" rx="1" fill={roofColor} style={{ transition: trans }} />
              {[[90,276,18,10],[80,278,12,7],[310,276,18,10],[320,278,12,7]].map(([cx,cy,rx,ry],i) => (
                <ellipse key={i} cx={cx} cy={cy} rx={rx} ry={ry} fill={groundColor} opacity={0.8 - i*0.05} style={{ transition: trans }} />
              ))}
              <rect x="340" y="258" width="3" height="22" fill="#4a4a55" />
              <rect x="335" y="253" width="14" height="10" rx="2" fill="#4a4a55" />
              {winter && <SnowCover part="garden" a={snowA} slotName={slotName} />}

              {use3d ? (
                s3 ? null : zzzEl
              ) : (<React.Fragment>
              {/* REH — süßes Bambi im linken Garten, steht zwischen den Blumen.
                  Bei Nachts-Slot: schläft (Körper sinkt, Beine retrahieren, Kopf legt sich vor den Körper).
                  sleepP=0 (wach) → sleepP=1 (schläft), animiert via useAnimatedValue (1800ms).
                  Follow-Through: Beine zuerst, Körper leicht verzögert, Kopf zuletzt. */}
              <g transform="translate(65, 293)" style={{ filter: isDay ? "brightness(1.15) saturate(1.05)" : isDawn ? "brightness(0.9) saturate(0.95)" : isDusk ? "brightness(0.72) saturate(0.9)" : "brightness(0.55) saturate(0.75)", transition: "filter 1.2s cubic-bezier(0.4, 0, 0.2, 1)" }}>

                {/* Schatten — etwas schwächer wenn schlafend */}
                <ellipse cx="-2" cy="15" rx="19" ry="2.2" fill="#000" opacity={0.28 - sleepP * 0.13} />

                {/* BEINE — schrumpfen von unten nach oben (Pivot y=2, Oberkante der Beine).
                    SVG-Transform: translate(0,2) scale(1,Y) translate(0,-2) hält y=2 fest
                    und zieht Hufe (y=15) nach oben. Bei sleepP=1: Beine komplett hinter Körper. */}
                <g transform={`translate(0, 2) scale(1, ${legScale}) translate(0, -2)`}>
                  <rect x="-14" y="2" width="2.6" height="13" rx="1.3" fill="#8b5a3c" />
                  <ellipse cx="-12.7" cy="15" rx="1.6" ry="0.9" fill="#3a2416" />
                  <rect x="-9.5" y="2" width="2.6" height="13" rx="1.3" fill="#8b5a3c" />
                  <ellipse cx="-8.2" cy="15" rx="1.6" ry="0.9" fill="#3a2416" />
                  <rect x="6" y="2" width="2.6" height="13" rx="1.3" fill="#8b5a3c" />
                  <ellipse cx="7.3" cy="15" rx="1.6" ry="0.9" fill="#3a2416" />
                  <rect x="10.5" y="2" width="2.6" height="13" rx="1.3" fill="#8b5a3c" />
                  <ellipse cx="11.8" cy="15" rx="1.6" ry="0.9" fill="#3a2416" />
                </g>

                {/* KÖRPER + KOPF — sinken gemeinsam auf den Boden ab (bodyShift: 0→10 SVG-Einheiten).
                    Körper-Unterkante (y=5) erreicht Bodenniveau (y=15) wenn sleepP=1. */}
                <g transform={`translate(0, ${bodyShift})`}>
                  {/* ATEM-GRUPPE — Amplitude skaliert mit sleepP (0→1.1 SVG-Einh.). Beim Aufwachen
                      schwindet die Amplitude automatisch wieder auf 0. */}
                  <g>
                    <animateTransform
                      attributeName="transform"
                      type="translate"
                      values={`0,0; 0,-${breatheAmp}; 0,0`}
                      keyTimes="0; 0.45; 1"
                      dur="3.8s"
                      repeatCount="indefinite"
                      calcMode="spline"
                      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"
                    />

                  {/* Körper — warmes Braun */}
                  <ellipse cx="-2" cy="-3" rx="17" ry="8" fill="#a6724a" />
                  {/* Weiße Bauchunterseite */}
                  <ellipse cx="-2" cy="3" rx="13" ry="3.5" fill="#f5e6c4" opacity="0.9" />

                  {/* Bambi-Flecken auf dem Rücken */}
                  <circle cx="-10" cy="-7" r="1.4" fill="#fff" opacity="0.75" />
                  <circle cx="-5" cy="-9" r="1.2" fill="#fff" opacity="0.7" />
                  <circle cx="0" cy="-7.5" r="1.3" fill="#fff" opacity="0.75" />
                  <circle cx="5" cy="-9" r="1.2" fill="#fff" opacity="0.65" />
                  <circle cx="9" cy="-5" r="1" fill="#fff" opacity="0.6" />
                  <circle cx="-13" cy="-4" r="0.9" fill="#fff" opacity="0.55" />
                  <circle cx="-7" cy="-4" r="0.8" fill="#fff" opacity="0.5" />

                  {/* Spiegel (statisch, leicht transparent) */}
                  <ellipse cx="-17" cy="-4" rx="2.5" ry="3.5" fill="#fff" opacity="0.80" />

                  {/* Wedel — kein Zucken wenn schlafend */}
                  <g transform="translate(-17, -8)">
                    {deerFullyAwake && <animateTransform
                      attributeName="transform"
                      type="rotate"
                      values="0;0;-22;0;0;-25;18;-15;0;0;-22;0;0;-20;15;0;0"
                      keyTimes="0;0.414;0.421;0.427;0.593;0.599;0.604;0.610;0.616;0.764;0.770;0.776;0.893;0.899;0.904;0.910;1"
                      calcMode="linear"
                      dur="14s"
                      repeatCount="indefinite"
                      additive="sum"
                    />}
                    <path d="M 0,0 C -2,-0.5 -2,-5.5 0,-5.5 C 2,-5.5 2,-0.5 0,0 Z" fill="#fff" />
                  </g>

                  {/* KOPF-WRAPPER — Schlaf-Rotation um Hals-Pivot (11,-3).
                      headAngle: 0° (wach, Kopf oben) → 48° (schlafend, Kopf vor Körper gelegt).
                      headTilt (innen): -sleepP×10° CCW um Schädelbasis (16,-13) — Nase leicht nach
                      oben, Stirn nach unten, wirkt wie "Kopf zur Seite legen".
                      Grasen-SMIL nur aktiv wenn deerFullyAwake (!deerSleeping && sleepP < 0.05). */}
                  <g transform={`rotate(${headAngle}, 11, -3)`}>
                    <g transform={deerFullyAwake ? undefined : `rotate(${-sleepP * 10}, 16, -13)`}>
                      {deerFullyAwake && <animateTransform
                        attributeName="transform"
                        attributeType="XML"
                        type="rotate"
                        values="0 11 -3; 0 11 -3; 65 11 -3; 68 11 -3; 63 11 -3; 67 11 -3; 64 11 -3; 69 11 -3; 63 11 -3; 65 11 -3; 0 11 -3; 0 11 -3"
                        keyTimes="0; 0.4; 0.47; 0.505; 0.535; 0.565; 0.59; 0.622; 0.652; 0.68; 0.75; 1"
                        dur="16s"
                        repeatCount="indefinite"
                        calcMode="spline"
                        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.6 0 0.2 1; 0.2 0 0.6 1; 0.6 0 0.2 1; 0.2 0 0.5 1; 0.6 0 0.2 1; 0.2 0 0.6 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
                      />}

                      {/* Hals */}
                      <path d="M 8,-6 Q 13,-11 17,-13 L 21,-11 Q 16,-6 11,-3 Z" fill="#a6724a" />

                      {/* Kopf */}
                      <path d="M 14,-22 Q 20,-26 25,-22 Q 29,-18 29,-13 Q 28,-9 24,-9 Q 19,-10 15,-12 Q 12,-15 13,-20 Z" fill="#a6724a" />
                      {/* Wange-Highlight */}
                      <ellipse cx="19" cy="-14" rx="2.5" ry="2" fill="#c2875f" opacity="0.55" />

                      {/* Schnauzenbereich */}
                      <ellipse cx="27" cy="-12.5" rx="3.2" ry="2.4" fill="#c9956b" />
                      <ellipse cx="28.5" cy="-12.2" rx="1" ry="0.8" fill="#1a1a1a" />
                      <circle cx="28.7" cy="-12.5" r="0.32" fill="#fff" opacity="0.6" />

                      {/* Offenes Auge (blinzeln) — äußere Gruppe regelt Schlaf-Fade,
                          innere Gruppe animiert Blinzeln. Opazitäten multiplizieren sich. */}
                      <g opacity={1 - sleepP}>
                        <g>
                          <animate
                            attributeName="opacity"
                            values="1;1;1;1;0;1;1;1;1;0;1;1"
                            keyTimes="0;0.15;0.17;0.18;0.185;0.19;0.5;0.52;0.53;0.535;0.54;1"
                            dur="7s"
                            repeatCount="indefinite"
                          />
                          <ellipse cx="21" cy="-16.5" rx="1.6" ry="2" fill="#1a1a1a" />
                          <circle cx="21.5" cy="-17.1" r="0.65" fill="#fff" />
                          <circle cx="21" cy="-15.8" r="0.28" fill="#fff" opacity="0.8" />
                        </g>
                      </g>

                      {/* Geschlossenes Schlaf-Auge — einfacher Bogen, blendet mit sleepP ein */}
                      <path
                        d="M 19.2,-16.5 Q 21,-14.8 22.8,-16.5"
                        stroke="#1a1a1a"
                        strokeWidth="1.3"
                        fill="none"
                        strokeLinecap="round"
                        opacity={sleepP}
                      />

                      {/* Ohren — kein Zucken wenn schlafend */}
                      <g transform="translate(17, -24)">
                        <g>
                          {deerFullyAwake && <animateTransform
                            attributeName="transform"
                            type="rotate"
                            values="0;0;-16;0;0;-18;12;-12;0;0;0;0;-14;0;0"
                            keyTimes="0;0.150;0.155;0.160;0.325;0.330;0.335;0.340;0.345;0.400;0.750;0.900;0.905;0.910;1"
                            calcMode="linear"
                            dur="16s"
                            repeatCount="indefinite"
                          />}
                          <ellipse cx="0" cy="-4.5" rx="1.8" ry="4.5" fill="#8b5a3c" />
                          <ellipse cx="0" cy="-4" rx="1" ry="3.2" fill="#c2875f" opacity="0.9" />
                        </g>
                      </g>

                      <g transform="translate(19, -22)">
                        <g>
                          {deerFullyAwake && <animateTransform
                            attributeName="transform"
                            type="rotate"
                            values="3;3;-14;3;3;-12;18;-6;3;3;3;3;-10;3;3"
                            keyTimes="0;0.100;0.105;0.110;0.250;0.255;0.260;0.265;0.270;0.400;0.750;0.850;0.855;0.860;1"
                            calcMode="linear"
                            dur="16s"
                            repeatCount="indefinite"
                          />}
                          <ellipse cx="0" cy="-6.5" rx="2.3" ry="6.5" fill="#a6724a" />
                          <ellipse cx="0" cy="-6" rx="1.4" ry="4.8" fill="#e0a88a" />
                        </g>
                      </g>
                    </g>
                  </g>

                  {/* Schlaf-Zzzs — steigen aus Kopfbereich auf und faden aus (wie Musiknoten beim Vogel).
                      Im Körper-lokalen Koordinatensystem: Kopf liegt bei ca. (29, -5) wenn schlafend.
                      Alle drei Zs gestaffelt (begin=-1.8s / -2.5s) → immer mehrere gleichzeitig sichtbar. */}
                  {sleepP > 0.6 && (
                    <g opacity={Math.min((sleepP - 0.6) / 0.4, 1)} fontFamily="Georgia, 'Times New Roman', serif" fontWeight="bold">
                      <text x="35" y="-10" fontSize="5.5" fill="#b0cce0" textAnchor="middle">
                        Z
                        <animate attributeName="y" values="-10; -38" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" />
                        <animate attributeName="opacity" values="0; 0.9; 0.9; 0" keyTimes="0; 0.12; 0.78; 1" dur="4s" repeatCount="indefinite" />
                      </text>
                      <text x="31" y="-8" fontSize="4" fill="#98bcd4" textAnchor="middle">
                        z
                        <animate attributeName="y" values="-8; -30" dur="3.2s" begin="-1.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" />
                        <animate attributeName="opacity" values="0; 0.8; 0.8; 0" keyTimes="0; 0.15; 0.75; 1" dur="3.2s" begin="-1.8s" repeatCount="indefinite" />
                      </text>
                      <text x="40" y="-13" fontSize="3.2" fill="#88acc4" textAnchor="middle">
                        z
                        <animate attributeName="y" values="-13; -33" dur="2.8s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" />
                        <animate attributeName="opacity" values="0; 0.7; 0.65; 0" keyTimes="0; 0.18; 0.72; 1" dur="2.8s" begin="-2.5s" repeatCount="indefinite" />
                      </text>
                    </g>
                  )}

                  </g>
                </g>
              </g>
              </React.Fragment>)}
            </g>

            </React.Fragment>}
            {!s3 && overlayEl}
          </g>
        </svg>
        {use3d && <Deer3D sleeping={deerSleeping} isDayish={isDay || isDawn || isDusk} zzzRef={zzzRef} winter={!!winter} scene={sceneState} noBf={s3 && (season === "spaetherbst" || season === "winter")}
          light={isDay ? 1.12 : isDawn ? 0.9 : isDusk ? 0.72 : 0.55} onFail={() => setDeer3dFailed(true)} />}

    // ─── MINI HOUSE ──────────────────────────────────────────────────────
    function MiniHouse({ slot, date, slotIdx, showBird, lg }) {
      const allNull = noDataCount(slot) === 4;
      const past = isSlotPast(date, slotIdx);
      const noConnection = allNull && past;
      const pending = allNull && !past;
      const sz = lg ? 38 : 30;
      const szH = lg ? 35 : 28;
      return (
        <svg viewBox="0 0 30 28" fill="none" style={{ width: sz, height: szH }}>
          <polygon points="3,14 15,5 27,14" fill="#4a3828" />
          <rect x="5" y="14" width="20" height="12" fill="#2d3548" />
          {noConnection ? <React.Fragment>
            <rect x="5" y="14" width="20" height="12" fill="#2a2a35" opacity="0.7" />
            <line x1="10" y1="19" x2="20" y2="19" stroke={C.error} strokeWidth="0.8" opacity="0.5" />

            <rect x="5" y="14" width="20" height="12" fill="#2a2a35" opacity="0.4" />

            <rect x="17" y="16" width="6" height="4" rx="0.5" fill={winColor(slot.s, C.tv)} opacity={isOn(slot.s)?0.8:1} />
            <rect x="13" y="20" width="4" height="6" rx="0.5" fill={isOn(slot.e)?"#5a9b5e":isError(slot.e)?"#7a4a3a":"#3a3a42"} />

    }
